<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Dinâmico — BI Campo Largo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root { --g1: #1f2421; --g2: #343a40; --y2: #8c9b00; --bg: #f8f9fa; }
  body { background: var(--bg); font-family: system-ui, -apple-system, sans-serif; }
  .navbar { background: var(--g1) !important; }
  .hero { background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff; }
  .card-kpi { border: 0; border-left: 5px solid var(--y2); box-shadow: 0 4px 12px #0000000d; }
  .kpi-title { font-size: .8rem; color: #6c757d; text-transform: uppercase; font-weight: 600; }
  .kpi-value { font-size: 1.35rem; font-weight: 700; color: var(--g1); }
  .chart-box { height: 320px; position: relative; }
</style>
</head>
<body>

<nav class="navbar navbar-dark"><div class="container-fluid px-4">
  <span class="navbar-brand fw-bold"><i class="bi bi-graph-up-arrow"></i> BI de Custos Municipal</span>
</div></nav>

<header class="hero py-4 mb-4"><div class="container-fluid px-4">
  <h1 class="display-6 fw-bold">Painel Conectado ao Google Sheets</h1>
  <p class="lead mb-0">Atualização em tempo real sincronizada com as abas da planilha pública.</p>
</div></header>

<main class="container-fluid px-4 mb-5">
<div class="card mb-4"><div class="card-body">
  <div class="row g-3 align-items-center">
    <div class="col-md-5">
      <label class="form-label fw-bold text-success"><i class="bi bi-layers-fill"></i> Selecionar Base / Aba:</label>
      <select id="seletorAba" class="form-select form-select-lg border-success fw-bold">
        <option value="BI_Dados">BI_Dados (Lançamentos de Custos)</option>
        <option value="BI_Objetos">BI_Objetos (Estrutura de Custos)</option>
        <option value="BI_Secretarias">BI_Secretarias (Órgãos)</option>
        <option value="BI_Quantidades">BI_Quantidades (Escolas/Alunos)</option>
      </select>
    </div>
    <div class="col-md-7 text-end">
      <span id="statusText" class="badge bg-secondary p-2 me-2">Aguardando</span>
      <button id="btnAtualizar" class="btn btn-success fw-bold"><i class="bi bi-arrow-clockwise"></i> Recarregar Dados</button>
    </div>
  </div>
</div></div>

<div class="row g-3 mb-4">
  <div class="col-md-3"><div class="card card-kpi p-3"><div class="kpi-title">Total Registros</div><div id="kpiTotal" class="kpi-value">0</div></div></div>
  <div class="col-md-3"><div class="card card-kpi p-3"><div class="kpi-title">Soma do Valor</div><div id="kpiSoma" class="kpi-value">R$ 0,00</div></div></div>
  <div class="col-md-3"><div class="card card-kpi p-3"><div class="kpi-title">Categorias Únicas</div><div id="kpiCategorias" class="kpi-value">0</div></div></div>
  <div class="col-md-3"><div class="card card-kpi p-3"><div class="kpi-title">Última Sincronização</div><div id="kpiData" class="kpi-value" style="font-size:1rem;">-</div></div></div>
</div>

<div class="row g-4 mb-4">
  <div class="col-lg-8"><div class="card p-3 shadow-sm"><h5 class="fw-bold mb-3">Top Categorias / Itens</h5><div class="chart-box"><canvas id="chartPrincipal"></canvas></div></div></div>
  <div class="col-lg-4"><div class="card p-3 shadow-sm"><h5 class="fw-bold mb-3">Distribuição Proporcional</h5><div class="chart-box"><canvas id="chartRosca"></canvas></div></div></div>
</div>

<div class="card shadow-sm"><div class="card-body">
  <h5 class="fw-bold mb-3">Tabela do Banco de Dados</h5>
  <div class="table-responsive" style="max-height:400px">
    <table class="table table-hover table-striped align-middle"><thead class="table-dark" id="thead"></thead><tbody id="tbody"></tbody></table>
  </div>
</div></div>
</main>

<script>
const SPREADSHEET_KEY = "2PACX-1vRBRpSH89dOIrPczxtgztNVYgzyfFt_8XxMvtw_OgIkp0ZWkO51UvySHCz0-j3l_Eu2sOVQ2Wat2riy";
let chart1 = null, chart2 = null;

const fmtMoney = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);
const fmtNum = v => new Intl.NumberFormat('pt-BR').format(v || 0);

async function carregarDados() {
  const aba = document.getElementById("seletorAba").value;
  const statusEl = document.getElementById("statusText");
  statusEl.className = "badge bg-warning p-2 me-2";
  statusEl.textContent = "Carregando...";

  const url = `https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_KEY}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(aba)}&t=${Date.now()}`;

  try {
    const res = await fetch(url);
    const text = await res.text();
    const jsonStr = text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1);
    const json = JSON.parse(jsonStr);

    const cols = json.table.cols.map((c, i) => c.label || c.id || `Coluna ${i+1}`);
    const rows = json.table.rows.map(r => {
      let item = {};
      cols.forEach((c, i) => {
        const val = r.c[i];
        item[c] = val ? (val.f !== undefined ? val.f : val.v) : "";
      });
      return item;
    });

    renderizar(cols, rows);
    statusEl.className = "badge bg-success p-2 me-2";
    statusEl.textContent = "Sincronizado";
  } catch (err) {
    statusEl.className = "badge bg-danger p-2 me-2";
    statusEl.textContent = "Erro na conexão";
  }
}

function renderizar(cols, rows) {
  document.getElementById("kpiTotal").textContent = fmtNum(rows.length);
  document.getElementById("kpiData").textContent = new Date().toLocaleTimeString('pt-BR');

  const colValor = cols.find(c => /valor|alunos|professores/i.test(c));
  const colGrupo = cols.find(c => /item|descrição|secretaria|departamento|nome/i.test(c)) || cols[0];

  let somaTotal = 0;
  let agrupado = {};

  rows.forEach(r => {
    let rawVal = r[colValor];
    let num = typeof rawVal === 'number' ? rawVal : parseFloat(String(rawVal).replace(/[R$\\s]/g, '').replace(',', '.')) || 0;
    somaTotal += num;

    let chave = String(r[colGrupo] || "Outros").trim();
    agrupado[chave] = (agrupado[chave] || 0) + num;
  });

  document.getElementById("kpiSoma").textContent = colValor ? fmtMoney(somaTotal) : "N/A";
  document.getElementById("kpiCategorias").textContent = fmtNum(Object.keys(agrupado).length);

  const top10 = Object.entries(agrupado).sort((a,b) => b[1] - a[1]).slice(0, 10);

  if (chart1) chart1.destroy();
  if (chart2) chart2.destroy();

  chart1 = new Chart(document.getElementById('chartPrincipal'), {
    type: 'bar',
    data: {
      labels: top10.map(x => x[0]),
      datasets: [{ label: colValor || 'Registros', data: top10.map(x => x[1]), backgroundColor: '#8c9b00' }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });

  chart2 = new Chart(document.getElementById('chartRosca'), {
    type: 'doughnut',
    data: {
      labels: top10.slice(0, 5).map(x => x[0]),
      datasets: [{ data: top10.slice(0, 5).map(x => x[1]), backgroundColor: ['#1f2421','#343a40','#8c9b00','#d9ea37','#6c757d'] }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });

  document.getElementById("thead").innerHTML = `<tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
  document.getElementById("tbody").innerHTML = rows.slice(0, 50).map(r => `<tr>${cols.map(c => `<td>${r[c] ?? ''}</td>`).join('')}</tr>`).join('');
}

document.getElementById("seletorAba").addEventListener("change", carregarDados);
document.getElementById("btnAtualizar").addEventListener("click", carregarDados);
carregarDados();
</script>
</body>
</html>
