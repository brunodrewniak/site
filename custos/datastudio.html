<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background-color: #000000; /* Fundo preto */
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Navbar com a cor especificada */
  .navbar-custom {
    background-color: #2e4b77 !important;
    box-shadow: 0 2px 12px rgba(0,0,0,.5);
    flex-shrink: 0;
  }

  /* Container principal flexível */
  .main-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: calc(100vh - 56px);
    overflow: hidden;
    padding: 8px;
    box-sizing: border-box;
    background-color: #000000;
  }

  .iframe-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .iframe-wrapper iframe {
    width: 100%;
    height: 100%;
    border: 0;
    aspect-ratio: 16 / 9;
    object-fit: contain;
  }

  /* Ajustes de tela cheia via JS */
  .iframe-wrapper:-webkit-full-screen { width: 100%; height: 100%; }
  .iframe-wrapper:-moz-full-screen { width: 100%; height: 100%; }
  .iframe-wrapper:fullscreen { width: 100%; height: 100%; }

  /* Adaptabilidade para orientações de tela */
  @media (max-aspect-ratio: 16/9) {
    .iframe-wrapper iframe {
      width: 100%;
      height: auto;
    }
  }

  @media (min-aspect-ratio: 16/9) {
    .iframe-wrapper iframe {
      width: auto;
      height: 100%;
    }
  }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
  <div class="container-fluid px-3">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
      <i class="bi bi-calculator"></i> 
      <span>Contabilidade Custos</span>
    </a>
    
    <div class="d-flex align-items-center gap-3">
      <span class="text-white small d-none d-sm-inline">Campo Largo - PR</span>
      
      <!-- Botão para ativar Tela Cheia -->
      <button id="btnFullscreen" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1" title="Alternar Tela Cheia">
        <i class="bi bi-fullscreen" id="fullscreenIcon"></i>
        <span class="d-none d-md-inline">Tela Cheia</span>
      </button>
    </div>
  </div>
</nav>

<div class="main-container">
  <div class="iframe-wrapper" id="frameContainer">
    <iframe id="dataStudioIframe" src="https://datastudio.google.com/embed/reporting/a590a5d0-f15b-4dc5-8580-0c59d9ed20fa/page/kyd4F" frameborder="0" style="border:0" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
  </div>
</div>

<script>
  const btnFullscreen = document.getElementById('btnFullscreen');
  const container = document.getElementById('frameContainer');
  const fullscreenIcon = document.getElementById('fullscreenIcon');

  function toggleFullscreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
      if (container.requestFullscreen) {
        container.requestFullscreen();
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      } else if (container.msRequestFullscreen) {
        container.msRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    }
  }

  btnFullscreen.addEventListener('click', toggleFullscreen);

  // Altera o ícone do botão dependendo do estado de Tela Cheia
  document.addEventListener('fullscreenchange', updateButtonIcon);
  document.addEventListener('webkitfullscreenchange', updateButtonIcon);

  function updateButtonIcon() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      fullscreenIcon.className = 'bi bi-fullscreen-exit';
    } else {
      fullscreenIcon.className = 'bi bi-fullscreen';
    }
  }
</script>

</body>
</html>
