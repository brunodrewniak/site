<script>
  const btnFullscreen = document.getElementById('btnFullscreen');
  const container = document.getElementById('frameContainer');
  const fullscreenIcon = document.getElementById('fullscreenIcon');

  function toggleFullscreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
      if (container.requestFullscreen) {
        container.requestFullscreen();
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      } else if (container.msRequestFullscreen) {
        container.msRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    }
  }

  btnFullscreen.addEventListener('click', toggleFullscreen);

  // Altera o ícone do botão dependendo do estado de Tela Cheia
  document.addEventListener('fullscreenchange', updateButtonIcon);
  document.addEventListener('webkitfullscreenchange', updateButtonIcon);

  function updateButtonIcon() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      fullscreenIcon.className = 'bi bi-fullscreen-exit';
    } else {
      fullscreenIcon.className = 'bi bi-fullscreen';
    }
  }
</script>

<script>
/* =====================================================================
   CHATBOT — BUSCA INTELIGENTE
   Mesma lógica de interpretação da pergunta do dashboard de custos,
   agora apresentada em formato de conversa.
   ===================================================================== */
(function(){
  const PUB_XLSX_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTYZ2LbusfHY8Bhur33Rk5dU5knq3ZEJEJRluMoOpyDUG5Jt31o9Az3aT_9h5GN66Hlc-GAzaHdYc2a/pub?output=xlsx";

  const $ = id => document.getElementById(id);
  let dados = [];
  let dadosCarregados = false;
  let carregando = false;
  let falarRespostas = false;

  // ---------- Utilitários ----------
  function moeda(v){ return new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v)||0); }

  function numero(valor){
    if(typeof valor === "number") return Number.isFinite(valor) ? valor : 0;
    if(!valor) return 0;
    let texto = String(valor).replace("R$","").trim();
    if(texto.includes(".") && texto.includes(",")) texto = texto.replace(/\./g,"").replace(",",".");
    else if(texto.includes(",")) texto = texto.replace(",",".");
    const n = Number(texto);
    return Number.isFinite(n) ? n : 0;
  }

  function paraData(valor){
    if(valor instanceof Date && !isNaN(valor)) return valor;
    if(typeof valor === "number"){
      const epoch = new Date(Date.UTC(1899,11,30));
      return new Date(epoch.getTime() + valor*86400000);
    }
    if(typeof valor === "string"){
      const d = new Date(valor);
      if(!isNaN(d)) return d;
    }
    return null;
  }

  function escapeHtml(v){
    return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function removerAcentos(t){
    return String(t ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  }

  function normalizarBusca(t){
    return removerAcentos(t).replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
  }

  // ---------- Carga dos dados (mesma planilha do dashboard) ----------
  async function carregarDados(){
    if(dadosCarregados || carregando) return;
    carregando = true;
    const status = $("chatStatusDados");
    status.innerHTML = '<i class="bi bi-hourglass-split me-1"></i>Carregando dados...';
    try{
      const resp = await fetch(PUB_XLSX_URL);
      if(!resp.ok) throw new Error("Erro " + resp.status);
      const buffer = await resp.arrayBuffer();
      const wb = XLSX.read(buffer, { type:"array", cellDates:true });
      processarWorkbook(wb);
      dadosCarregados = true;
      status.innerHTML = `<i class="bi bi-check-circle-fill text-success me-1"></i>${dados.length.toLocaleString("pt-BR")} lançamentos carregados.`;
    }catch(e){
      console.error("Chatbot: falha ao carregar dados", e);
      status.innerHTML = '<i class="bi bi-exclamation-triangle-fill text-danger me-1"></i>Não foi possível carregar os dados. <a href="#" id="chatTentarNovamente">Tentar novamente</a>';
      const link = $("chatTentarNovamente");
      if(link) link.addEventListener("click", ev=>{ ev.preventDefault(); carregarDados(); });
    }finally{
      carregando = false;
    }
  }

  function processarWorkbook(wb){
    const abaDados = wb.Sheets["Dados"];
    if(!abaDados) throw new Error('Aba "Dados" não encontrada.');

    const secMap = {}, deptMap = {}, objMap = {}, locMap = {};

    if(wb.Sheets["Secretarias"]){
      XLSX.utils.sheet_to_json(wb.Sheets["Secretarias"]).forEach(r=>{
        const cod = r["Objeto de Custo - Secretaria"];
        if(cod) secMap[String(cod).trim()] = { nome: r["Secretaria"] || "" };
      });
    }
    if(wb.Sheets["Departamentos"]){
      XLSX.utils.sheet_to_json(wb.Sheets["Departamentos"]).forEach(r=>{
        const cod = r["Objeto de Custo - Departamento"];
        if(cod) deptMap[String(cod).trim()] = r["Departamento"] || "";
      });
    }
    if(wb.Sheets["Objetos"]){
      XLSX.utils.sheet_to_json(wb.Sheets["Objetos"]).forEach(r=>{
        const cod = r["Objeto de Custo"];
        if(cod) objMap[String(cod).trim()] = r["Descrição"] || "";
      });
    }
    if(wb.Sheets["Localização"]){
      XLSX.utils.sheet_to_json(wb.Sheets["Localização"]).forEach(r=>{
        const cod = r["Objeto de Custo"];
        if(!cod) return;
        const nome = String(r["Nome"] || "").trim();
        locMap[String(cod).trim()] = { naoUtilizar: /^n[aã]o utilizar/i.test(nome) };
      });
    }

    const linhas = XLSX.utils.sheet_to_json(abaDados, { defval:null });
    dados = linhas.filter(r => r["Objeto de Custo"]).map(r=>{
      const codigo = String(r["Objeto de Custo"]).trim();
      const partes = codigo.split(".");
      const secCod = partes.slice(0,2).join(".");
      const deptCod = partes.slice(0,3).join(".");
      return {
        data: paraData(r["Data"]),
        objetoCodigo: codigo,
        objetoNome: objMap[codigo] || codigo,
        secretaria: (secMap[secCod] || {}).nome || "Não identificado",
        departamento: deptMap[deptCod] || "Não identificado",
        itemCusto: r["Item de Custo"] || "Não informado",
        valor: numero(r["Valor Apropriado"])
      };
    });
  }

  // ---------- Interpretação da pergunta (mesma lógica do dashboard) ----------
  const MESES_BUSCA = {
    "janeiro":0,"jan":0,"fevereiro":1,"fev":1,"marco":2,"mar":2,"abril":3,"abr":3,
    "maio":4,"mai":4,"junho":5,"jun":5,"julho":6,"jul":6,"agosto":7,"ago":7,
    "setembro":8,"set":8,"outubro":9,"out":9,"novembro":10,"nov":10,"dezembro":11,"dez":11
  };
  const NOMES_MES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const STOPWORDS_BUSCA = new Set([
    "de","da","do","das","dos","em","no","na","nos","nas","para","com","sem",
    "por","que","uma","um","uns","umas","e","a","o","as","os","ao","aos","à",
    "quanto","quanta","quantos","quantas","foi","foram","qual","quais","custo",
    "custos","valor","valores","total","gasto","gastos","gastou","gastaram",
    "apropriado","apropriados","referente","referentes","mes","mês","ano","dia"
  ]);

  function melhorCorrespondenciaBusca(queryNorm, candidatos, minScore=0.5, minPalavras=1){
    let melhor = null;
    candidatos.forEach(original=>{
      const candNorm = normalizarBusca(original);
      const palavras = candNorm.split(" ").filter(p=>p.length>2 && !STOPWORDS_BUSCA.has(p));
      const base = palavras.length ? palavras : candNorm.split(" ").filter(Boolean);
      if(!base.length) return;
      const encontradas = base.filter(p => queryNorm.includes(p));
      const score = encontradas.length / base.length;
      const necessario = Math.min(minPalavras, base.length);
      if(encontradas.length < necessario) return;
      if(score < minScore) return;
      if(!melhor || score > melhor.score || (score === melhor.score && encontradas.length > melhor.encontradas)){
        melhor = { valor: original, score, encontradas: encontradas.length };
      }
    });
    return melhor;
  }

  // Retorna { html, fala }
  function responderPergunta(pergunta){
    const queryNorm = normalizarBusca(pergunta);

    // Saudações / ajuda
    if(/^(oi|ola|bom dia|boa tarde|boa noite|e ai|hello|hi)\b/.test(queryNorm) && queryNorm.split(" ").length <= 3){
      return { html: "Olá! 👋 Pergunte sobre custos por item, unidade, secretaria ou mês.", fala: "Olá! Pergunte sobre custos por item, unidade, secretaria ou mês.", sugestoes: true };
    }
    if(/\b(ajuda|help|como funciona|o que voce faz|exemplos?)\b/.test(queryNorm)){
      return { html: "Eu consulto os lançamentos de custo da planilha. Cite um <b>item de custo</b>, uma <b>unidade</b>, uma <b>secretaria</b> e/ou um <b>mês/ano</b>. Exemplo:<br><em>\"custo com merenda escolar na escola reino da loucinha em setembro\"</em>", fala: "Cite um item de custo, uma unidade, uma secretaria ou um mês, e eu somo os lançamentos para você.", sugestoes: false };
    }

    if(!dados.length){
      return { html: "Os dados ainda não foram carregados. Aguarde um instante e tente novamente.", fala: "Os dados ainda não foram carregados." };
    }

    // Mês
    let mesEncontrado = null;
    for(const chave in MESES_BUSCA){
      if(new RegExp(`\\b${chave}\\b`).test(queryNorm)){ mesEncontrado = MESES_BUSCA[chave]; break; }
    }
    // Ano
    const matchAno = queryNorm.match(/\b(20\d{2})\b/);
    const anoEncontrado = matchAno ? Number(matchAno[1]) : null;

    const itemEncontrado = melhorCorrespondenciaBusca(queryNorm, [...new Set(dados.map(d=>d.itemCusto).filter(Boolean))], 0.5, 2);
    const objetoEncontrado = melhorCorrespondenciaBusca(queryNorm, [...new Set(dados.map(d=>d.objetoNome).filter(Boolean))], 0.5, 2);
    const secretariaEncontrada = melhorCorrespondenciaBusca(queryNorm, [...new Set(dados.map(d=>d.secretaria).filter(Boolean))], 0.6, 2);

    let resultado = dados;
    if(anoEncontrado) resultado = resultado.filter(d => d.data && d.data.getFullYear() === anoEncontrado);
    if(mesEncontrado !== null) resultado = resultado.filter(d => d.data && d.data.getMonth() === mesEncontrado);
    if(itemEncontrado) resultado = resultado.filter(d => d.itemCusto === itemEncontrado.valor);
    if(objetoEncontrado) resultado = resultado.filter(d => d.objetoNome === objetoEncontrado.valor);
    if(secretariaEncontrada) resultado = resultado.filter(d => d.secretaria === secretariaEncontrada.valor);

    const nenhumCriterio = mesEncontrado === null && !anoEncontrado && !itemEncontrado && !objetoEncontrado && !secretariaEncontrada;
    if(nenhumCriterio){
      return {
        html: 'Não consegui identificar item de custo, unidade, secretaria ou mês na pergunta. Tente algo como:<br><em>"custo com merenda escolar na escola reino da loucinha em setembro"</em>',
        fala: "Não consegui entender sua pergunta. Tente citar um item de custo, uma unidade ou um mês."
      };
    }

    // Chips
    const chips = [];
    if(secretariaEncontrada) chips.push(`<span class="chip">Secretaria: <b>${escapeHtml(secretariaEncontrada.valor)}</b></span>`);
    if(objetoEncontrado) chips.push(`<span class="chip">Unidade: <b>${escapeHtml(objetoEncontrado.valor)}</b></span>`);
    if(itemEncontrado) chips.push(`<span class="chip">Item: <b>${escapeHtml(itemEncontrado.valor)}</b></span>`);
    if(mesEncontrado !== null) chips.push(`<span class="chip">Mês: <b>${NOMES_MES[mesEncontrado]}${anoEncontrado ? "/"+anoEncontrado : ""}</b></span>`);
    else if(anoEncontrado) chips.push(`<span class="chip">Ano: <b>${anoEncontrado}</b></span>`);

    // Descrição falada
    const partes = [];
    if(itemEncontrado) partes.push(itemEncontrado.valor);
    if(objetoEncontrado) partes.push(`na ${objetoEncontrado.valor}`);
    else if(secretariaEncontrada) partes.push(`na ${secretariaEncontrada.valor}`);
    if(mesEncontrado !== null) partes.push(`em ${NOMES_MES[mesEncontrado].toLowerCase()}${anoEncontrado ? " de "+anoEncontrado : ""}`);
    else if(anoEncontrado) partes.push(`em ${anoEncontrado}`);
    const descricaoFalada = partes.join(" ");

    if(!resultado.length){
      return {
        html: `<div>${chips.join("")}</div><div class="sub">Nenhum lançamento encontrado para esses critérios.</div>`,
        fala: `Não encontrei nenhum lançamento${descricaoFalada ? " de " + descricaoFalada : ""}.`
      };
    }

    const total = resultado.reduce((t,d)=>t+d.valor,0);
    const registros = resultado.length;
    const limite = 8;
    const linhas = resultado.slice()
      .sort((a,b)=> (b.data?.getTime()||0) - (a.data?.getTime()||0))
      .slice(0, limite)
      .map(d=>`<tr>
        <td>${d.data ? d.data.toLocaleDateString("pt-BR") : "—"}</td>
        <td>${escapeHtml(d.objetoNome)}<br><span class="sub">${escapeHtml(d.itemCusto)}</span></td>
        <td class="dir">${moeda(d.valor)}</td>
      </tr>`).join("");

    const html = `
      <div>${chips.join("")}</div>
      <div class="valor">${moeda(total)}</div>
      <div class="sub">em ${registros.toLocaleString("pt-BR")} lançamento(s)</div>
      <table>
        <thead><tr><th>Data</th><th>Unidade / Item</th><th class="dir">Valor</th></tr></thead>
        <tbody>${linhas}</tbody>
      </table>
      ${registros > limite ? `<div class="sub mt-1">Mostrando ${limite} de ${registros.toLocaleString("pt-BR")} lançamentos.</div>` : ""}`;

    const registrosTexto = registros === 1 ? "1 lançamento" : `${registros.toLocaleString("pt-BR")} lançamentos`;
    return { html, fala: `${descricaoFalada ? "Custo com " + descricaoFalada + ": " : ""}${moeda(total)}, em ${registrosTexto}.` };
  }

  // ---------- Interface do chat ----------
  const fab = $("chatFab"), painel = $("chatPanel"), msgs = $("chatMensagens");
  const campo = $("chatCampo"), btnEnviar = $("chatEnviar");

  function rolarFim(){ msgs.scrollTop = msgs.scrollHeight; }

  function adicionarMensagem(html, tipo){
    const div = document.createElement("div");
    div.className = "msg " + tipo;
    div.innerHTML = html;
    msgs.appendChild(div);
    rolarFim();
    return div;
  }

  function htmlSugestoes(){
    const exemplos = [
      "Quanto foi gasto em setembro?",
      "Custo com merenda escolar",
      "Gastos da Secretaria de Saúde em outubro"
    ];
    return `<div class="sugestoes">${exemplos.map(e=>`<button type="button" data-sugestao="${escapeHtml(e)}">${escapeHtml(e)}</button>`).join("")}</div>`;
  }

  function mensagemBoasVindas(){
    adicionarMensagem(
      `Olá! Sou o assistente de <b>Busca Inteligente</b> de custos. Pergunte por voz ou digitando, citando item de custo, unidade, secretaria ou mês.${htmlSugestoes()}`,
      "bot"
    );
  }

  function abrirChat(){
    painel.classList.add("aberto");
    fab.classList.add("aberto");
    if(!msgs.children.length) mensagemBoasVindas();
    carregarDados();
    setTimeout(()=>campo.focus(), 50);
  }
  function fecharChat(){
    painel.classList.remove("aberto");
    fab.classList.remove("aberto");
    if("speechSynthesis" in window) window.speechSynthesis.cancel();
  }

  function enviarPergunta(textoOpcional, porVoz){
    const pergunta = (textoOpcional ?? campo.value).trim();
    if(!pergunta) return;
    campo.value = "";
    adicionarMensagem(escapeHtml(pergunta), "user");

    const digitando = adicionarMensagem('<span class="digitando"><span></span><span></span><span></span></span>', "bot");

    const processar = async ()=>{
      if(!dadosCarregados) await carregarDados();
      let resp;
      try{ resp = responderPergunta(pergunta); }
      catch(e){ console.error(e); resp = { html: "Ocorreu um erro ao processar a pergunta.", fala: "Ocorreu um erro ao processar a pergunta." }; }
      digitando.remove();
      adicionarMensagem(resp.html + (resp.sugestoes ? htmlSugestoes() : ""), "bot");
      if(falarRespostas || porVoz) falar(resp.fala);
    };
    setTimeout(processar, 350);
  }

  // ---------- Voz: síntese ----------
  let vozPtBR = null;
  function carregarVozPtBR(){
    if(!("speechSynthesis" in window)) return;
    const vozes = window.speechSynthesis.getVoices();
    vozPtBR = vozes.find(v=>v.lang === "pt-BR") || vozes.find(v=>v.lang && v.lang.startsWith("pt")) || null;
  }
  if("speechSynthesis" in window){
    carregarVozPtBR();
    window.speechSynthesis.onvoiceschanged = carregarVozPtBR;
  }
  function falar(texto){
    if(!("speechSynthesis" in window) || !texto) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texto);
      u.lang = "pt-BR";
      if(vozPtBR) u.voice = vozPtBR;
      window.speechSynthesis.speak(u);
    }catch(e){ console.warn("Não foi possível falar a resposta:", e); }
  }

  // ---------- Voz: reconhecimento ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let reconhecimento = null, ouvindo = false;
  const btnMic = $("chatMic");

  function iniciarVoz(){
    if(!SR){ alert("Reconhecimento de voz não é suportado neste navegador. Use o Google Chrome ou o Microsoft Edge."); return; }
    if(ouvindo){ reconhecimento && reconhecimento.stop(); return; }
    reconhecimento = new SR();
    reconhecimento.lang = "pt-BR";
    reconhecimento.interimResults = false;
    reconhecimento.maxAlternatives = 1;
    reconhecimento.continuous = false;
    reconhecimento.onstart = ()=>{ ouvindo = true; btnMic.classList.add("ouvindo"); campo.placeholder = "Ouvindo... fale sua pergunta"; };
    reconhecimento.onresult = ev=>{ enviarPergunta(ev.results[0][0].transcript, true); };
    reconhecimento.onerror = ev=>{ if(ev.error !== "no-speech" && ev.error !== "aborted") console.warn("Erro de voz:", ev.error); };
    reconhecimento.onend = ()=>{ ouvindo = false; btnMic.classList.remove("ouvindo"); campo.placeholder = "Digite ou fale sua pergunta..."; };
    try{ reconhecimento.start(); }catch(e){ console.warn(e); }
  }

  // ---------- Eventos ----------
  fab.addEventListener("click", abrirChat);
  $("chatFechar").addEventListener("click", fecharChat);
  btnEnviar.addEventListener("click", ()=>enviarPergunta());
  campo.addEventListener("keydown", ev=>{ if(ev.key === "Enter") enviarPergunta(); });
  btnMic.addEventListener("click", iniciarVoz);
  if(!SR){ btnMic.disabled = true; btnMic.title = "Reconhecimento de voz não suportado neste navegador"; }

  $("chatVozToggle").addEventListener("click", ev=>{
    falarRespostas = !falarRespostas;
    const b = ev.currentTarget;
    b.classList.toggle("ativo", falarRespostas);
    b.innerHTML = falarRespostas ? '<i class="bi bi-volume-up-fill"></i>' : '<i class="bi bi-volume-mute-fill"></i>';
    b.title = falarRespostas ? "Resposta por voz ativada" : "Responder por voz";
    if(!falarRespostas && "speechSynthesis" in window) window.speechSynthesis.cancel();
  });

  msgs.addEventListener("click", ev=>{
    const btn = ev.target.closest("[data-sugestao]");
    if(btn) enviarPergunta(btn.dataset.sugestao);
  });
})();
</script>

</body>
</html>
