<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de Custos | BI de Custos Campo Largo</title>

<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" rel="stylesheet">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
/* Layout: mapa em tela cheia; painel do BI flutuante à frente (z-index acima das camadas do Leaflet).
   Paleta herdada do dashboard.html (amarelo #f2b705 sobre grafite #212529). */
:root{
  --amarelo:#f2b705;
  --amarelo-escuro:#c79300;
  --grafite:#212529;
  --grafite-2:#2c3036;
  --papel:#f8f9fa;
  --linha:rgba(255,255,255,.12);
  --muted:#9aa1a8;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--grafite);color:var(--papel);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#mapa{position:absolute;inset:0}
.leaflet-container{background:var(--grafite-2);font-family:inherit}
.leaflet-control-attribution{font-size:10px}

.painel{
  position:absolute;top:16px;left:16px;width:440px;max-width:calc(100% - 32px);
  max-height:calc(100% - 32px);overflow:auto;
  background:var(--grafite);border:1px solid var(--linha);border-top:3px solid var(--amarelo);
  border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.35);z-index:1100;
}
.painel header{padding:14px 16px 10px;border-bottom:1px solid var(--linha)}
.painel h1{font-size:1.1rem;margin:0 0 2px;line-height:1.25;text-wrap:balance;display:flex;gap:8px;align-items:flex-start}
.painel h1 svg{flex:none;margin-top:2px}
.sub{font-size:.78rem;color:var(--muted);margin:0}
.corpo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:16px}
h2{font-size:.72rem;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}

/* Seleção de secretaria / local */
.busca-sec{position:relative}
.campo.busca-sec input{padding-left:28px}
.busca-sec svg{position:absolute;left:8px;bottom:9px;pointer-events:none}
.lista-sec{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:168px;overflow:auto}
.lista-sec button{
  width:100%;display:flex;align-items:center;gap:8px;text-align:left;padding:6px 8px;font-size:.8rem;
  background:transparent;color:var(--papel);border:1px solid transparent;border-radius:5px;cursor:pointer
}
.lista-sec button:hover{background:var(--grafite-2)}
.lista-sec button[aria-pressed="true"]{border-color:var(--amarelo);background:var(--grafite-2);font-weight:700}
.lista-sec .bolinha{width:10px;height:10px;border-radius:50%;background:var(--amarelo);flex:none;border:2px solid var(--grafite)}
.lista-sec [aria-pressed="false"] .bolinha{background:var(--muted)}
.lista-sec .qtd{margin-left:auto;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.lista-sec .grupo{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 8px 2px}
.sem-resultado{font-size:.78rem;color:var(--muted);padding:6px 8px}
.lista-sec button:focus-visible{outline:2px solid var(--amarelo);outline-offset:1px}
.cabecalho-sec{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cabecalho-sec h2{margin:0}
.aviso{font-size:.74rem;color:var(--muted);margin:8px 0 0;line-height:1.4}
.local{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding:6px 8px;
  border-radius:5px;background:var(--grafite-2);border-left:3px solid var(--amarelo);font-size:.8rem}
.local[hidden]{display:none}
.local span{min-width:0;font-weight:600}

/* Período e Filtros */
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.campo{display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.campo.cheio{grid-column:1 / -1}
.campo label{font-size:.72rem;font-weight:600;color:var(--papel)}
.campo input,.campo select{
  width:100%;padding:6px 8px;font-size:.8rem;border-radius:5px;border:1px solid var(--linha);
  background:var(--grafite-2);color:var(--papel);color-scheme:dark;min-width:0
}
.campo input:focus-visible,.campo select:focus-visible,.btn:focus-visible{outline:2px solid var(--amarelo);outline-offset:1px}
.btn{padding:6px 10px;font-size:.78rem;border-radius:5px;border:1px solid var(--linha);background:transparent;color:var(--papel);cursor:pointer}
.btn:hover{background:var(--grafite-2)}
.btn-mini{padding:2px 8px;font-size:.72rem}

/* Indicadores (mesmos cards do BI) */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--grafite-2);border-radius:6px;padding:8px 10px;min-width:0;border-top:2px solid var(--amarelo-escuro)}
.kpi small{display:block;font-size:.66rem;color:var(--muted)}
.kpi b{display:block;font-size:.95rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi.grande{grid-column:1 / -1;border-top-color:var(--amarelo)}
.kpi.grande b{font-size:1.7rem;color:var(--amarelo)}

/* Gráficos */
.grafico{background:var(--grafite-2);border-radius:6px;padding:10px}
.grafico h2{margin-bottom:6px}
.caixa{position:relative;height:200px}

/* Tabela de lançamentos */
.tabela-wrap{overflow:auto;max-height:260px;border:1px solid var(--linha);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:.74rem}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--linha);vertical-align:top}
th{position:sticky;top:0;background:var(--grafite-2);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.nota{font-size:.72rem;color:var(--muted);margin:6px 0 0}

.estado{font-size:.85rem;color:var(--muted);line-height:1.5;margin:0}
.estado.erro{color:#ffb4a8}
.origem{font-size:.72rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.ponto{width:8px;height:8px;border-radius:50%;background:#20c997;flex:none}

/* Agrupamento de marcadores sobrepostos */
.cluster{background:none;border:0}
.cluster div{
  width:38px;height:38px;border-radius:50%;background:var(--grafite);color:var(--amarelo);border:3px solid var(--amarelo);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;box-shadow:0 3px 8px rgba(0,0,0,.45)
}
.diag{font-size:.7rem;color:var(--muted);margin:6px 0 0;line-height:1.4;overflow-wrap:anywhere}

/* Marcador */
.pino{background:none;border:0}
.pino svg{display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));transition:transform .15s;transform-origin:50% 100%}
.pino.sel svg{transform:scale(1.25)}
.pino-rotulo{
  background:var(--grafite);color:var(--papel);border:1px solid var(--amarelo);border-radius:5px;
  box-shadow:none;font-size:12px;font-weight:600;padding:3px 8px
}
.pino-rotulo::before{border-top-color:var(--amarelo)!important}

@media (max-width:640px){
  .painel{top:auto;bottom:0;left:0;right:0;width:auto;max-width:none;max-height:62%;border-radius:12px 12px 0 0}
}
</style>
</head>
<body>

<div id="mapa"></div>
<aside class="painel" id="painel" aria-live="polite"></aside>

<script>
// ================= Configuração =================
const PUB_XLSX_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRBRpSH89dOIrPczxtgztNVYgzyfFt_8XxMvtw_OgIkp0ZWkO51UvySHCz0-j3l_Eu2sOVQ2Wat2riy/pub?output=xlsx";
const ZOOM_INICIAL = 18.65;
const CENTRO_INICIAL = [-25.455052, -49.5179145];   // vista inicial: zoom na prefeitura
const LINHAS_TABELA = 50;
const PALETA_CORES = [
  "#20c997","#fd7e14","#0dcaf0","#6f42c1","#ffc107","#198754","#d63384","#0d6efd","#e83e8c","#6c757d",
  "#17a2b8","#28a745","#ff851b","#b10dc9","#39ccd7"
];

// ================= Utilitários =================
const $ = id => document.getElementById(id);
const moeda = v => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v)||0);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

function numero(v){
  if(typeof v==="number") return Number.isFinite(v)?v:0;
  if(!v) return 0;
  let t = String(v).replace("R$","").trim();
  if(t.includes(".")&&t.includes(",")) t=t.replace(/\./g,"").replace(",",".");
  else if(t.includes(",")) t=t.replace(",",".");
  const n=Number(t); return Number.isFinite(n)?n:0;
}
function paraData(v){
  if(v instanceof Date && !isNaN(v)) return v;
  if(typeof v==="number") return new Date(Date.UTC(1899,11,30)+v*86400000);
  if(typeof v==="string"){ const d=new Date(v); if(!isNaN(d)) return d; }
  return null;
}
function dataISO(d){
  if(!d) return "";
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
const dataBR = d => d ? d.toLocaleDateString("pt-BR") : "";

// Procura a coluna pelo cabeçalho, sem diferenciar maiúsculas, acentos ou espaços
const chaveCol = k => norm(k).replace(/[^a-z0-9]/g,"");
function acharChave(linha, regex){
  return Object.keys(linha).find(k => regex.test(chaveCol(k)));
}
const vazio = v => v===null || v===undefined || String(v).trim()==="";

// Converte uma coordenada para número. Aceita número, texto com vírgula ou ponto decimal, sinal "−",
// graus/minutos/segundos (25°27'16"S) e valores sem separador decimal (-25454614). Devolve null se não reconhecer.
function lerCoordenada(v, ehLongitude){
  if(vazio(v)) return null;
  const limite = ehLongitude ? 180 : 90;
  let n;
  if(typeof v==="number") n = v;
  else {
    let t = String(v).trim().replace(/[−–—]/g,"-");
    if(/[°º]/.test(t)){
      const p = t.match(/\d+(?:[.,]\d+)?/g) || [];
      if(!p.length) return null;
      const num = x => Number(String(x||0).replace(",","."));
      n = num(p[0]) + num(p[1])/60 + num(p[2])/3600;
      if(/-|[SWO]\s*$/i.test(t)) n = -n;
    } else {
      t = t.replace(/[^0-9.,\-]/g,"");
      const pontos = (t.match(/\./g)||[]).length, virgulas = (t.match(/,/g)||[]).length;
      if(pontos && virgulas){                 // 1.234,56 ou 1,234.56: o último separador é o decimal
        const dec = t.lastIndexOf(",") > t.lastIndexOf(".") ? "," : ".";
        t = dec===","? t.replace(/\./g,"").replace(",",".") : t.replace(/,/g,"");
      } else if(virgulas){ t = t.replace(",",".").replace(/,/g,""); }
      else if(pontos>1){ const k = t.indexOf("."); t = t.slice(0,k+1) + t.slice(k+1).replace(/\./g,""); }
      n = Number(t);
    }
  }
  if(!Number.isFinite(n) || n===0) return null;
  if(ehLongitude && n>180 && n<=360) n -= 360;          // ex.: 310.480743 vira -49.519257
  if(Math.abs(n)>=1000) for(let k=0; Math.abs(n)>limite && k<12; k++) n /= 10;   // ex.: -25454614 vira -25.454614
  return Math.abs(n)<=limite ? n : null;
}

// ================= Dados (planilha publicada, a mesma do BI) =================
let secretarias = [];      // [{cod, nome, linhas:[...], locais:[...]}]
let centroAtual = -1;      // índice em secretarias
let objetoSel = null;      // código do objeto de custo selecionado pelo marcador ou pela busca
let carregado = false;
let diagObjetos = null;

async function carregarPlanilha(){
  const resp = await fetch(PUB_XLSX_URL, { cache:"no-store" });
  if(!resp.ok) throw new Error("HTTP "+resp.status);
  const wb = XLSX.read(await resp.arrayBuffer(), { type:"array", cellDates:true });
  if(!wb.Sheets["Dados"] || !wb.Sheets["Secretarias"]) throw new Error('Abas "Dados" e "Secretarias" não encontradas.');

  const secPorCodigo = {}, deptMap = {}, objMap = {}, locais = [];
  XLSX.utils.sheet_to_json(wb.Sheets["Secretarias"]).forEach(r=>{
    const c = r["Objeto de Custo - Secretaria"]; if(c) secPorCodigo[String(c).trim()] = r["Secretaria"] || "";
  });
  if(wb.Sheets["Departamentos"]) XLSX.utils.sheet_to_json(wb.Sheets["Departamentos"]).forEach(r=>{
    const c = r["Objeto de Custo - Departamento"]; if(c) deptMap[String(c).trim()] = r["Departamento"] || "";
  });
  // Aba Objetos: Descrição + Latitude/Longitude. Só entra no mapa quem tem as duas coordenadas preenchidas.
  diagObjetos = { lidos:0, comAmbas:0, invalidos:[], colLat:null, colLng:null, colunas:[] };
  if(wb.Sheets["Objetos"]){
    const lin = XLSX.utils.sheet_to_json(wb.Sheets["Objetos"], { defval:null });
    if(lin.length){
      const amostra = lin[0];
      diagObjetos.colunas = Object.keys(amostra);
      diagObjetos.colLat = acharChave(amostra, /^lat/) ?? null;
      diagObjetos.colLng = acharChave(amostra, /^(lng|lon)/) ?? null;
    }
    lin.forEach(r=>{
      const kCod = acharChave(r, /^(objetodecusto|codigo|centrodecusto)/) ?? Object.keys(r)[0];
      const kDesc = acharChave(r, /^(descricao|nome)/);
      const c = r[kCod]; if(vazio(c)) return;
      const cod = String(c).trim();
      const nome = (kDesc && !vazio(r[kDesc])) ? String(r[kDesc]).trim() : cod;
      objMap[cod] = nome;
      diagObjetos.lidos++;
      const bLat = diagObjetos.colLat ? r[diagObjetos.colLat] : null, bLng = diagObjetos.colLng ? r[diagObjetos.colLng] : null;
      if(vazio(bLat) && vazio(bLng)) return;               // sem coordenadas: não aparece no mapa
      let lat = lerCoordenada(bLat,false), lng = lerCoordenada(bLng,true);
      if(lat===null && lng===null){ // talvez estejam trocadas (lat na coluna de longitude)
        const a = lerCoordenada(bLng,false), b = lerCoordenada(bLat,true);
        if(a!==null && b!==null){ lat=a; lng=b; }
      }
      if(lat!==null && lng!==null){
        diagObjetos.comAmbas++;
        locais.push({ cod, nome, secCod:cod.split(".").slice(0,2).join("."), lat, lng });
      } else if(diagObjetos.invalidos.length<4){
        diagObjetos.invalidos.push(`${nome}: "${bLat??""}" / "${bLng??""}"`);
      }
    });
  }

  const linhas = XLSX.utils.sheet_to_json(wb.Sheets["Dados"], { defval:null })
    .filter(r => r["Objeto de Custo"])
    .map(r => {
      const cod = String(r["Objeto de Custo"]).trim();
      const p = cod.split(".");
      const dep = p.slice(0,3).join(".");
      return {
        cod, secCod:p.slice(0,2).join("."),
        data: paraData(r["Data"]),
        departamentoCodigo: dep,
        departamento: deptMap[dep] || "Não identificado",
        objetoNome: objMap[cod] || cod,
        itemCusto: r["Item de Custo"] || "Não informado",
        valor: numero(r["Valor Apropriado"])
      };
    });

  // Todas as secretarias da planilha; códigos de objetos sem secretaria cadastrada também entram
  const cods = new Map(Object.entries(secPorCodigo));
  linhas.forEach(l=>{ if(!cods.has(l.secCod)) cods.set(l.secCod, ""); });
  locais.forEach(l=>{ if(!cods.has(l.secCod)) cods.set(l.secCod, ""); });
  return [...cods.entries()]
    .map(([cod,nome])=>({
      cod, nome: String(nome||("Secretaria "+cod)).trim(),
      linhas: linhas.filter(l=>l.secCod===cod),
      locais: locais.filter(l=>l.secCod===cod)
    }))
    .sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
}

// ================= Painel =================
const graficos = {};

function mesAtualPadrao(){
  const h = new Date();
  return [dataISO(new Date(h.getFullYear(),h.getMonth(),1)), dataISO(new Date(h.getFullYear(),h.getMonth()+1,0))];
}
function opcoes(linhas, chave, rotulo){
  const m = new Map(linhas.map(l=>[l[chave], l[rotulo||chave]]));
  return [...m.entries()].sort((a,b)=>String(a[1]).localeCompare(String(b[1]),"pt-BR"));
}

function montarPainel(){
  const [ini, fim] = mesAtualPadrao();
  $("painel").innerHTML = `
    <header>
      <h1><svg width="18" height="18" viewBox="0 0 24 24" fill="#f2b705" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span id="tituloSec">BI de Custos | Campo Largo</span></h1>
      <p class="sub" id="subPeriodo">Carregando dados da planilha...</p>
      <div class="local" id="chipLocal" hidden>
        <span id="nomeLocal"></span>
        <button type="button" class="btn btn-mini" id="btnTodosLocais">Ver secretaria inteira</button>
      </div>
    </header>
    <div class="corpo">
      <section>
        <div class="cabecalho-sec"><h2>Secretarias e locais</h2>
          <button class="btn btn-mini" id="btnVerTodas" type="button">Ver todos no mapa</button></div>
        <div class="campo busca-sec">
          <label for="buscaSecretaria" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Buscar secretaria ou local</label>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9aa1a8" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input type="search" id="buscaSecretaria" placeholder="Buscar secretaria ou local (Descrição)" autocomplete="off">
        </div>
        <ul class="lista-sec" id="listaSecretarias"></ul>
        <p class="aviso" id="avisoLocais"></p>
        <p class="diag" id="diagObjetos"></p>
      </section>

      <section>
        <h2>Período e Filtros</h2>
        <div class="filtros">
          <div class="campo"><label for="dataInicial">Data Inicial</label><input type="date" id="dataInicial" value="${ini}"></div>
          <div class="campo"><label for="dataFinal">Data Final</label><input type="date" id="dataFinal" value="${fim}"></div>
          <div class="campo"><label for="filtroDepartamento">Departamento</label>
            <select id="filtroDepartamento"><option value="">Todos</option></select></div>
          <div class="campo"><label for="filtroItem">Item de Custo</label>
            <select id="filtroItem"><option value="">Todos</option></select></div>
          <div class="campo cheio"><label for="filtroBusca">Buscar Unidade / Objeto</label>
            <input type="text" id="filtroBusca" placeholder="Ex: CMEI, Escola, Secretaria..."></div>
        </div>
        <div style="margin-top:10px"><button class="btn" id="btnLimpar" type="button">Limpar Filtros</button></div>
      </section>

      <div id="estado" class="estado">Carregando dados do BI...</div>

      <div id="conteudo" hidden>
        <section class="kpis">
          <div class="kpi grande"><small>Total Apropriado</small><b id="kTotal">R$ 0,00</b></div>
          <div class="kpi"><small>Registros</small><b id="kRegistros">0</b></div>
          <div class="kpi"><small>Itens de Custo</small><b id="kItens">0</b></div>
          <div class="kpi"><small>Unidades/Objetos</small><b id="kObjetos">0</b></div>
          <div class="kpi"><small>Departamentos</small><b id="kDeptos">0</b></div>
          <div class="kpi" style="grid-column:span 2"><small>Média / Lançamento</small><b id="kMedia">R$ 0,00</b></div>
        </section>

        <section class="grafico" style="margin-top:16px"><h2>Evolução Mensal do Custo</h2><div class="caixa"><canvas id="graficoMensal"></canvas></div></section>
        <section class="grafico" style="margin-top:12px"><h2>Top 10 Itens de Custo</h2><div class="caixa"><canvas id="graficoItem"></canvas></div></section>
        <section class="grafico" style="margin-top:12px"><h2>Top 10 Departamentos</h2><div class="caixa"><canvas id="graficoDepartamento"></canvas></div></section>

        <section style="margin-top:16px">
          <h2>Lançamentos</h2>
          <div class="tabela-wrap">
            <table><thead><tr><th>Data</th><th>Unidade / Objeto</th><th>Item de Custo</th><th class="num">Valor</th></tr></thead>
            <tbody id="tbody"></tbody></table>
          </div>
          <p class="nota" id="notaTabela"></p>
        </section>
        <div class="origem" style="margin-top:12px"><span class="ponto"></span>Dados da planilha publicada do BI</div>
      </div>
    </div>`;

  ["dataInicial","dataFinal","filtroDepartamento","filtroItem"].forEach(id=>$(id).addEventListener("change", atualizarResultado));
  $("filtroBusca").addEventListener("input", atualizarResultado);
  $("btnLimpar").addEventListener("click", ()=>{
    const [i,f] = mesAtualPadrao();
    $("dataInicial").value=i; $("dataFinal").value=f;
    $("filtroDepartamento").value=""; $("filtroItem").value=""; $("filtroBusca").value="";
    atualizarResultado();
  });
  $("btnVerTodas").addEventListener("click", ()=>{
    const pts = marcadores.map(m=>m.getLatLng());
    if(pts.length) mapa.fitBounds(pts, { padding:[60,60], maxZoom:17 });
  });
  $("btnTodosLocais").addEventListener("click", ()=> selecionar(centroAtual, true, true, null));

  // Busca: filtra sem acento; Enter seleciona o primeiro resultado; setas percorrem a lista
  $("buscaSecretaria").addEventListener("input", renderizarLista);
  $("buscaSecretaria").addEventListener("keydown", ev=>{
    const primeira = $("listaSecretarias").querySelector("button");
    if(ev.key==="Enter" && primeira){ ev.preventDefault(); primeira.click(); }
    else if(ev.key==="ArrowDown" && primeira){ ev.preventDefault(); primeira.focus(); }
  });
  $("listaSecretarias").addEventListener("keydown", ev=>{
    const botoes = [...$("listaSecretarias").querySelectorAll("button")];
    const k = botoes.indexOf(document.activeElement);
    if(ev.key==="ArrowDown" && botoes[k+1]){ ev.preventDefault(); botoes[k+1].focus(); }
    if(ev.key==="ArrowUp"){ ev.preventDefault(); (botoes[k-1] || $("buscaSecretaria")).focus(); }
  });
  renderizarLista();
}

function renderizarLista(){
  const termo = norm($("buscaSecretaria").value.trim().replace(/^secretaria\s+(municipal\s+)?(d[aeo]s?\s+)?/i,""));
  const secs = secretarias.map((c,i)=>[c,i]).filter(([c])=>!termo || norm(c.nome).includes(termo));
  // Com algo digitado, a busca também procura nos objetos de custo (coluna Descrição) que estão no mapa
  const locais = termo ? secretarias.flatMap((d,i)=>d.locais.map(l=>[l,i])).filter(([l])=>norm(l.nome).includes(termo)).slice(0,30) : [];
  let html = secs.map(([c,i])=>`
    <li><button type="button" data-i="${i}" aria-pressed="${i===centroAtual && !objetoSel}"><span class="bolinha"></span>${esc(c.nome.replace(/^Secretaria Municipal d[aeo]\s+/,""))}<span class="qtd">${c.locais.length ? c.locais.length+" no mapa" : ""}</span></button></li>`).join("");
  if(locais.length) html += `<li class="grupo">Locais no mapa</li>` + locais.map(([l,i])=>`
    <li><button type="button" data-i="${i}" data-cod="${esc(l.cod)}" aria-pressed="${l.cod===objetoSel}"><span class="bolinha"></span>${esc(l.nome)}</button></li>`).join("");
  $("listaSecretarias").innerHTML = html || `<li class="sem-resultado">${secretarias.length ? "Nada encontrado." : "Aguardando a planilha..."}</li>`;
  $("listaSecretarias").querySelectorAll("button").forEach(b=>
    b.addEventListener("click", ()=> selecionar(Number(b.dataset.i), true, false, b.dataset.cod || null)));
}

// Seleciona uma secretaria (e, opcionalmente, um local dela): atualiza filtros, indicadores e marcadores
function selecionar(i, voar, manterFiltros, objeto){
  if(i<0 || !secretarias[i]) return;
  const mudouSec = i !== centroAtual;
  centroAtual = i;
  objetoSel = objeto === undefined ? (mudouSec ? null : objetoSel) : objeto;
  const d = secretarias[i];
  $("tituloSec").textContent = d.nome;

  const local = objetoSel ? d.locais.find(l=>l.cod===objetoSel) : null;
  $("chipLocal").hidden = !local;
  if(local) $("nomeLocal").textContent = local.nome;

  const dep = manterFiltros ? $("filtroDepartamento").value : "";
  const item = manterFiltros ? $("filtroItem").value : "";
  $("filtroDepartamento").innerHTML = `<option value="">Todos</option>` +
    opcoes(d.linhas,"departamentoCodigo","departamento").map(([c,n])=>`<option value="${esc(c)}">${esc(n)}</option>`).join("");
  $("filtroItem").innerHTML = `<option value="">Todos</option>` +
    opcoes(d.linhas,"itemCusto").map(([c])=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
  $("filtroDepartamento").value = dep; $("filtroItem").value = item;
  if(!manterFiltros) $("filtroBusca").value = "";

  atualizarResultado();
  renderizarLista();
  atualizarAviso();
  marcadores.forEach(m=> destacarMarcador(m, m.local.secIdx===i, m.local.cod===objetoSel));

  if(voar){
    const pontos = (local ? [local] : d.locais).map(l=>[l.lat,l.lng]);
    const alvo = local ? marcadores.find(m=>m.local.cod===local.cod) : null;
    if(alvo && grupo) grupo.zoomToShowLayer(alvo, ()=>{ mapa.panTo(alvo.getLatLng()); alvo.openTooltip(); });
    else if(pontos.length===1) mapa.flyTo(pontos[0], Math.max(mapa.getZoom(), ZOOM_INICIAL), { duration:.8 });
    else if(pontos.length) mapa.flyToBounds(pontos, { padding:[80,80], maxZoom:ZOOM_INICIAL, duration:.8 });
  }
}

function mostrarDiagnostico(){
  const g = diagObjetos; if(!g) return;
  let t = `Aba Objetos: ${g.lidos} objeto(s) lidos, ${g.comAmbas} com Latitude e Longitude válidas no mapa.`;
  if(!g.colLat || !g.colLng) t += ` Coluna não encontrada: ${!g.colLat?"Latitude":""}${!g.colLat&&!g.colLng?" e ":""}${!g.colLng?"Longitude":""}. Colunas da aba: ${g.colunas.join(", ")||"nenhuma"}.`;
  if(g.invalidos.length) t += ` Valores não reconhecidos (ex.): ${g.invalidos.join(" | ")}.`;
  $("diagObjetos").textContent = t;
}

function atualizarAviso(){
  mostrarDiagnostico();
  const total = secretarias.reduce((t,d)=>t+d.locais.length,0);
  const d = secretarias[centroAtual];
  let msg = "";
  if(!total) msg = "Nenhum objeto de custo com Latitude e Longitude preenchidas na aba Objetos.";
  else if(d && !d.locais.length) msg = "Esta secretaria ainda não tem objetos com Latitude e Longitude preenchidas.";
  else if(d) msg = `${d.locais.length} ${d.locais.length===1?"local desta secretaria está":"locais desta secretaria estão"} no mapa. Clique num marcador para ver só os custos dele.`;
  $("avisoLocais").textContent = msg;
}

// ================= Indicadores, gráficos e tabela (mesmos cálculos do BI) =================
function agrupar(linhas, campo, limite){
  const m = {};
  linhas.forEach(l=> m[l[campo]] = (m[l[campo]]||0) + l.valor);
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,limite);
}
function agruparPorMes(linhas){
  const m = {};
  linhas.forEach(l=>{
    if(!l.data) return;
    const k = `${l.data.getFullYear()}-${String(l.data.getMonth()+1).padStart(2,"0")}`;
    m[k] = (m[k]||0) + l.valor;
  });
  return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]));
}
function desenhar(id, config){
  if(graficos[id]) graficos[id].destroy();
  graficos[id] = new Chart($(id), config);
}
function opcoesGrafico(extra){
  return Object.assign({
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => moeda(ctx.raw) } } },
    scales:{
      x:{ ticks:{color:"#c9ced3", font:{size:10}}, grid:{color:"rgba(255,255,255,.08)"} },
      y:{ ticks:{color:"#c9ced3", font:{size:10}}, grid:{color:"rgba(255,255,255,.08)"} }
    }
  }, extra||{});
}

function atualizarResultado(){
  const d = secretarias[centroAtual];
  if(!d) return;
  const ini = $("dataInicial").value, fim = $("dataFinal").value;
  const dep = $("filtroDepartamento").value, item = $("filtroItem").value;
  const busca = norm($("filtroBusca").value.trim());

  const sel = d.linhas.filter(l=>{
    const ds = dataISO(l.data);
    return (!ini || (ds && ds>=ini)) && (!fim || (ds && ds<=fim)) &&
      (!objetoSel || l.cod===objetoSel || l.cod.startsWith(objetoSel+".")) &&
      (!dep || l.departamentoCodigo===dep) && (!item || l.itemCusto===item) &&
      (!busca || norm(l.objetoNome).includes(busca) || norm(l.departamento).includes(busca) || norm(d.nome).includes(busca));
  });

  const fmt = s => s ? s.split("-").reverse().join("/") : "…";
  $("subPeriodo").textContent = `Custos apropriados de ${fmt(ini)} a ${fmt(fim)}`;

  if(!sel.length){
    $("estado").hidden = false;
    $("estado").textContent = "Nenhum lançamento encontrado com os filtros aplicados.";
    $("conteudo").hidden = true;
    return;
  }
  $("estado").hidden = true;
  $("conteudo").hidden = false;

  const total = sel.reduce((t,l)=>t+l.valor,0);
  $("kTotal").textContent = moeda(total);
  $("kRegistros").textContent = sel.length.toLocaleString("pt-BR");
  $("kItens").textContent = new Set(sel.map(l=>l.itemCusto)).size.toLocaleString("pt-BR");
  $("kObjetos").textContent = new Set(sel.map(l=>l.cod)).size.toLocaleString("pt-BR");
  $("kDeptos").textContent = new Set(sel.map(l=>l.departamentoCodigo)).size.toLocaleString("pt-BR");
  $("kMedia").textContent = moeda(total/sel.length);

  const mensal = agruparPorMes(sel);
  desenhar("graficoMensal", { type:"line",
    data:{ labels:mensal.map(([k])=>{const [a,m]=k.split("-");return `${m}/${a}`;}),
      datasets:[{ label:"Custo Total (R$)", data:mensal.map(([,v])=>v), borderColor:"#f2b705",
        backgroundColor:"rgba(242,183,5,.18)", fill:true, tension:.3, borderWidth:2, pointRadius:3 }] },
    options:opcoesGrafico() });

  const itens = agrupar(sel,"itemCusto",10);
  desenhar("graficoItem", { type:"bar",
    data:{ labels:itens.map(i=>i[0]), datasets:[{ label:"Valor Apropriado", data:itens.map(i=>i[1]), backgroundColor:PALETA_CORES.slice(0,10) }] },
    options:opcoesGrafico({ indexAxis:"y" }) });

  const deps = agrupar(sel,"departamento",10);
  desenhar("graficoDepartamento", { type:"bar",
    data:{ labels:deps.map(i=>i[0]), datasets:[{ label:"Valor Apropriado", data:deps.map(i=>i[1]), backgroundColor:PALETA_CORES.slice(2,12) }] },
    options:opcoesGrafico({ indexAxis:"y" }) });

  const recentes = [...sel].sort((a,b)=>(b.data||0)-(a.data||0)).slice(0,LINHAS_TABELA);
  $("tbody").innerHTML = recentes.map(l=>`
    <tr><td>${esc(dataBR(l.data))}</td><td>${esc(l.objetoNome)}</td><td>${esc(l.itemCusto)}</td><td class="num"><b>${moeda(l.valor)}</b></td></tr>`).join("");
  $("notaTabela").textContent = sel.length>LINHAS_TABELA
    ? `Mostrando os ${LINHAS_TABELA} lançamentos mais recentes de ${sel.length.toLocaleString("pt-BR")}.`
    : `${sel.length.toLocaleString("pt-BR")} lançamento(s).`;
}

// ================= Mapa (Leaflet, sem token) =================
let mapa = null;
const marcadores = [];

function criarIcone(secSel, localSel){
  const cor = secSel ? "#f2b705" : "#9aa1a8";
  return L.divIcon({
    className:"pino"+(localSel?" sel":""), iconSize:[36,46], iconAnchor:[18,46], tooltipAnchor:[0,-40],
    html:`<svg width="36" height="46" viewBox="0 0 36 46" aria-hidden="true">
      <path d="M18 1C9 1 2 8 2 17c0 12 16 28 16 28s16-16 16-28C34 8 27 1 18 1z" fill="${cor}" stroke="#212529" stroke-width="2"/>
      <circle cx="18" cy="17" r="6.5" fill="#212529"/></svg>`
  });
}
// Marcadores da secretaria selecionada ficam amarelos; o local selecionado fica maior, com o nome aberto
function destacarMarcador(m, secSel, localSel){
  m.setIcon(criarIcone(secSel, localSel));
  m.setZIndexOffset(localSel ? 1000 : (secSel ? 500 : 0));
  m.unbindTooltip();
  m.bindTooltip(esc(m.local.nome), { permanent:localSel, direction:"top", className:"pino-rotulo" });
  if(localSel) m.openTooltip();
}

function iniciarMapa(){
  mapa = L.map("mapa", { zoomSnap:0, zoomDelta:0.5, maxZoom:20, zoomControl:false }).setView(CENTRO_INICIAL, ZOOM_INICIAL);
  L.control.zoom({ position:"topright" }).addTo(mapa);
  const ruas = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom:20, maxNativeZoom:19, attribution:"&copy; OpenStreetMap" }).addTo(mapa);
  const satelite = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxZoom:20, maxNativeZoom:19, attribution:"Imagens &copy; Esri" });
  L.control.layers({ "Mapa de ruas":ruas, "Satélite":satelite }, null, { position:"topright" }).addTo(mapa);
}

// Um marcador por objeto de custo com Latitude e Longitude preenchidas na aba Objetos.
// Marcadores muito próximos ou na mesma coordenada ficam agrupados; clicar no grupo abre os pinos.
let grupo = null;
function criarMarcadores(){
  if(grupo) grupo.remove();
  marcadores.length = 0;
  grupo = L.markerClusterGroup({
    maxClusterRadius:36, showCoverageOnHover:false, spiderfyOnMaxZoom:true, zoomToBoundsOnClick:true,
    iconCreateFunction: c => L.divIcon({ html:`<div>${c.getChildCount()}</div>`, className:"cluster", iconSize:[38,38] })
  });
  secretarias.forEach((d,secIdx)=>{
    d.locais.forEach(l=>{
      l.secIdx = secIdx;
      const m = L.marker([l.lat,l.lng], { icon:criarIcone(false,false), title:l.nome, keyboard:true });
      m.local = l;
      m.on("click", ()=> selecionar(secIdx, false, true, l.cod));
      marcadores.push(m);
      grupo.addLayer(m);
    });
  });
  mapa.addLayer(grupo);
}

// ================= Início =================
async function iniciar(){
  $("estado").hidden = false; $("estado").classList.remove("erro");
  $("estado").textContent = "Carregando dados do BI...";
  try{
    secretarias = await carregarPlanilha();
  }catch(e){
    console.warn("Falha ao ler a planilha:", e);
    $("subPeriodo").textContent = "Dados indisponíveis";
    $("estado").classList.add("erro");
    $("estado").innerHTML = `Não foi possível ler a planilha publicada (${esc(e.message)}). Verifique a conexão e tente de novo. <button class="btn btn-mini" id="btnRetry" type="button">Tentar novamente</button>`;
    $("btnRetry").addEventListener("click", iniciar);
    return;
  }
  carregado = true;
  criarMarcadores();
  // Abre na Fazenda, se existir; senão, na primeira secretaria que tenha local no mapa
  let i = secretarias.findIndex(c=>/fazenda/i.test(c.nome));
  if(i<0) i = Math.max(0, secretarias.findIndex(c=>c.locais.length));
  selecionar(i, false);
}

iniciarMapa();
montarPainel();
iniciar();
</script>
