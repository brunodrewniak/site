<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Objetos de Custo 2026</title>

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    .conta-card {
      transition: border-color 0.15s ease-in-out, transform 0.15s ease-in-out;
      cursor: pointer;
    }
    .conta-card:hover {
      border-color: var(--bs-primary) !important;
      transform: translateY(-2px);
    }
    .codigo-mono {
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
  </style>
</head>
<body class="bg-body-tertiary min-vh-100 d-flex flex-column">

  <!-- Header Sticky com Busca e Filtros -->
  <header class="sticky-top bg-body border-bottom shadow-sm py-3">
    <div class="container position-relative">
      
      <!-- Botão de Alternar Dark / Light Mode -->
      <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm position-absolute top-0 end-0 mt-1 me-1" title="Alternar tema Claro/Escuro">
        <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
      </button>

      <div class="text-center mb-3">
        <h1 class="h3 fw-bold text-primary mb-1">
          <i class="bi bi-diagram-3-fill me-2"></i>Objetos de Custo 2026
        </h1>
        <p class="text-secondary small mb-0">Pesquise por código (* para coringa), descrição ou filtre por nível e analítico.</p>
      </div>

      <!-- Barra de Pesquisa -->
      <div class="row justify-content-center mb-2">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" id="searchInput" class="form-control" placeholder="Ex: *0010* ou CMEI ou 0002.0010..." autocomplete="off">
            <button class="btn btn-outline-secondary" type="button" id="clearBtn" style="display: none;">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Filtros Dropdown -->
      <div class="row g-2 justify-content-center">
        <div class="col-12 col-sm-auto">
          <select id="nivelFilter" class="form-select form-select-sm">
            <option value="">Todos os níveis</option>
            <option value="1">Nível 1</option>
            <option value="2">Nível 2</option>
            <option value="3">Nível 3</option>
            <option value="4">Nível 4</option>
          </select>
        </div>
        <div class="col-6 col-sm-auto">
          <select id="analiticoFilter" class="form-select form-select-sm">
            <option value="">Todos os tipos (Analítico)</option>
            <option value="Sim">Sim (Lançamento)</option>
            <option value="Não">Não (Sintético)</option>
          </select>
        </div>
        <div class="col-6 col-sm-auto">
          <select id="sortOrder" class="form-select form-select-sm">
            <option value="asc">Classificação (Crescente)</option>
            <option value="desc">Classificação (Decrescente)</option>
            <option value="nome">Descrição (A-Z)</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container py-4 flex-grow-1">
    <!-- Barra de Contadores -->
    <div class="d-flex justify-content-between align-items-center mb-3 text-secondary small">
      <span id="resultCount"></span>
      <span id="totalCount"></span>
    </div>

    <!-- Lista de Resultados -->
    <div id="results" class="d-flex flex-column gap-2"></div>

    <!-- Botão Carregar Mais -->
    <div class="text-center mt-4">
      <button id="loadMoreBtn" class="btn btn-outline-primary px-4" style="display: none;">
        Carregar mais registros
      </button>
    </div>
  </main>

  <!-- Toast para copiar classificação -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="copyToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          <i class="bi bi-check-circle-fill me-2"></i>Classificação copiada para a área de transferência!
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="dados.js">
  // conta, nome, descricao, nivel, analitico
  </script>
  
  

  <script>
  // Base de Dados de Objetos de Custo 2026
 
  let filteredData = [];
  let page = 1;
  const PAGE_SIZE = 50;

  // Elementos DOM
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const nivelFilter = document.getElementById('nivelFilter');
  const analiticoFilter = document.getElementById('analiticoFilter');
  const sortOrder = document.getElementById('sortOrder');
  const resultsDiv = document.getElementById('results');
  const resultCount = document.getElementById('resultCount');
  const totalCount = document.getElementById('totalCount');
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  const themeToggleBtn = document.getElementById('themeToggleBtn');
  const themeIcon = document.getElementById('themeIcon');

  // Lógica de Tema (Dark / Light)
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-bs-theme', theme);
    localStorage.setItem('theme', theme);

    if (theme === 'dark') {
      themeIcon.className = 'bi bi-sun-fill text-warning';
      themeToggleBtn.classList.replace('btn-outline-dark', 'btn-outline-secondary');
    } else {
      themeIcon.className = 'bi bi-moon-stars-fill text-dark';
      themeToggleBtn.classList.replace('btn-outline-secondary', 'btn-outline-dark');
    }
  }

  const savedTheme = localStorage.getItem('theme') || 
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(savedTheme);

  themeToggleBtn.addEventListener('click', () => {
    const currentTheme = document.documentElement.getAttribute('data-bs-theme');
    applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
  });

  // Busca com Curinga (*)
  function buildWildcardRegex(query) {
    const escaped = query.replace(/[-\/\\^$+?.()|[\]{}]/g, '\\$&');
    const regexStr = '^' + escaped.replace(/\*/g, '.*');
    return new RegExp(regexStr, 'i');
  }

  // Filtragem e Ordenação
  function filterData() {
    const query = searchInput.value.trim().toLowerCase();
    const selectedNivel = nivelFilter.value;
    const selectedAnalitico = analiticoFilter.value;
    const selectedSort = sortOrder.value;

    clearBtn.style.display = query ? 'block' : 'none';

    filteredData = DATA.filter(item => {
      if (selectedNivel && item.nivel !== selectedNivel) return false;
      if (selectedAnalitico && item.analitico !== selectedAnalitico) return false;

      if (query) {
        if (query.includes('*')) {
          const regex = buildWildcardRegex(query);
          return regex.test(item.conta) || regex.test(item.nome);
        } else {
          return item.conta.toLowerCase().includes(query) ||
                 item.nome.toLowerCase().includes(query) ||
                 (item.descricao && item.descricao.toLowerCase().includes(query));
        }
      }

      return true;
    });

    // Aplicação da Ordenação Padrão
    filteredData.sort((a, b) => {
      if (selectedSort === 'asc') {
        return a.conta.localeCompare(b.conta, 'pt-BR', { numeric: true });
      } else if (selectedSort === 'desc') {
        return b.conta.localeCompare(a.conta, 'pt-BR', { numeric: true });
      } else if (selectedSort === 'nome') {
        return a.nome.localeCompare(b.nome, 'pt-BR');
      }
    });

    page = 1;
    renderResults();
  }

  // Renderização dos Cards
  function renderResults() {
    resultsDiv.innerHTML = '';
    const toRender = filteredData.slice(0, page * PAGE_SIZE);

    if (filteredData.length === 0) {
      resultsDiv.innerHTML = `
        <div class="text-center py-5 text-secondary">
          <i class="bi bi-search display-4 mb-2 d-block"></i>
          <p class="mb-0">Nenhum objeto de custo encontrado para o filtro informado.</p>
        </div>`;
      loadMoreBtn.style.display = 'none';
    } else {
      toRender.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card conta-card shadow-sm';

        const badgeAnalitico = item.analitico === 'Sim'
          ? '<span class="badge text-bg-success">Analítico (Sim)</span>'
          : '<span class="badge text-bg-secondary">Sintético (Não)</span>';

        card.innerHTML = `
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
              <span class="fw-bold codigo-mono text-info h6 mb-0" title="Clique no card para expandir a descrição">${item.conta}</span>
              <div class="d-flex gap-1">
                <span class="badge text-bg-primary-subtle text-primary border border-primary-subtle">Nível ${item.nivel}</span>
                ${badgeAnalitico}
                <button class="btn btn-sm btn-outline-secondary py-0 px-1 border-0" onclick="copyCode(event, '${item.conta}')" title="Copiar código">
                  <i class="bi bi-copy"></i>
                </button>
              </div>
            </div>
            <h2 class="h6 card-title mb-1 text-body-emphasis">${item.nome}</h2>
            ${item.descricao ? `
              <div class="collapse mt-2 text-secondary small" id="desc-${index}">
                <div class="pt-2 border-top"><i class="bi bi-info-circle me-1"></i>${item.descricao}</div>
              </div>
            ` : ''}
          </div>
        `;

        if (item.descricao) {
          card.addEventListener('click', (e) => {
            if (e.target.closest('button')) return; // Evita abrir collapse ao clicar em copiar
            const collapseEl = document.getElementById(`desc-${index}`);
            const bsCollapse = bootstrap.Collapse.getOrCreateInstance(collapseEl);
            bsCollapse.toggle();
          });
        }

        resultsDiv.appendChild(card);
      });

      loadMoreBtn.style.display = (toRender.length < filteredData.length) ? 'inline-block' : 'none';
    }

    resultCount.textContent = `Exibindo ${Math.min(toRender.length, filteredData.length)} de ${filteredData.length} resultados`;
    totalCount.textContent = `Total: ${DATA.length} objetos`;
  }

  // Copiar código da conta
  function copyCode(event, text) {
    event.stopPropagation();
    navigator.clipboard.writeText(text).then(() => {
      const copyToast = document.getElementById('copyToast');
      const toast = new bootstrap.Toast(copyToast);
      toast.show();
    });
  }

  // Event Listeners
  searchInput.addEventListener('input', filterData);
  nivelFilter.addEventListener('change', filterData);
  analiticoFilter.addEventListener('change', filterData);
  sortOrder.addEventListener('change', filterData);

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    filterData();
  });

  loadMoreBtn.addEventListener('click', () => {
    page++;
    renderResults();
  });

  // Inicialização
  filterData();
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
