<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plano de Contas - PCASP Federação 2022</title>

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    /* Estilos complementares de refinamento */
    .conta-card {
      transition: border-color 0.15s ease-in-out, transform 0.15s ease-in-out;
      cursor: pointer;
    }
    .conta-card:hover {
      border-color: var(--bs-primary) !important;
      transform: translateY(-2px);
    }
    .codigo-mono {
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
  </style>
</head>
<body class="bg-body-tertiary min-vh-100 d-flex flex-column">

  <!-- Header Sticky com Busca e Filtros -->
  <header class="sticky-top bg-body border-bottom shadow-sm py-3">
    <div class="container position-relative">
      
      <!-- Botão de Alternar Dark / Light Mode -->
      <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm position-absolute top-0 end-0 mt-1 me-1" title="Alternar tema Claro/Escuro">
        <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
      </button>

      <div class="text-center mb-3">
        <h1 class="h3 fw-bold text-primary mb-1">
          <i class="bi bi-bar-chart-fill me-2"></i>Plano de Contas PCASP
        </h1>
        <p class="text-secondary small mb-0">Dica: Busque por código (* para coringa), nome ou descrição</p>
      </div>

      <!-- Barra de Pesquisa -->
      <div class="row justify-content-center mb-2">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" id="searchInput" class="form-control" placeholder="Ex: *1110000 ou 1*1 ou caixa..." autocomplete="off">
            <button class="btn btn-outline-secondary" type="button" id="clearBtn" style="display: none;">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Filtros Dropdown -->
      <div class="row g-2 justify-content-center">
        <div class="col-12 col-sm-auto">
          <select id="classeFilter" class="form-select form-select-sm">
            <option value="">Todas as classes</option>
            <option value="1">1 - Ativo</option>
            <option value="2">2 - Passivo</option>
            <option value="3">3 - VPD</option>
            <option value="4">4 - VPA</option>
            <option value="5">5 - Controle Orçamentário (Aprovação)</option>
            <option value="6">6 - Controle Orçamentário (Execução)</option>
            <option value="7">7 - Controle Devedor</option>
            <option value="8">8 - Controle Credor</option>
          </select>
        </div>
        <div class="col-6 col-sm-auto">
          <select id="statusFilter" class="form-select form-select-sm">
            <option value="">Todos os status</option>
            <option value="Ativa">Ativa</option>
          </select>
        </div>
        <div class="col-6 col-sm-auto">
          <select id="naturezaFilter" class="form-select form-select-sm">
            <option value="">Todas as naturezas</option>
            <option value="Devedora">Devedora</option>
            <option value="Credora">Credora</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container py-4 flex-grow-1">
    <!-- Barra de Contadores -->
    <div class="d-flex justify-content-between align-items-center mb-3 text-secondary small">
      <span id="resultCount"></span>
      <span id="totalCount"></span>
    </div>

    <!-- Lista de Resultados -->
    <div id="results" class="d-flex flex-column gap-2"></div>

    <!-- Botão Carregar Mais -->
    <div class="text-center mt-4">
      <button id="loadMoreBtn" class="btn btn-outline-primary px-4" style="display: none;">
        Carregar mais contas
      </button>
    </div>
  </main>

  <script src="dados.js"></script>
  
  <script>
  // Exemplo de dados. Substitua pelo seu array completo ou importação do dados.js
  let filteredData = [];
  let page = 1;
  const PAGE_SIZE = 50;

  // Elementos do DOM
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const classeFilter = document.getElementById('classeFilter');
  const statusFilter = document.getElementById('statusFilter');
  const naturezaFilter = document.getElementById('naturezaFilter');
  const resultsDiv = document.getElementById('results');
  const resultCount = document.getElementById('resultCount');
  const totalCount = document.getElementById('totalCount');
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  const themeToggleBtn = document.getElementById('themeToggleBtn');
  const themeIcon = document.getElementById('themeIcon');

  // LÓGICA DO DARK / LIGHT MODE
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-bs-theme', theme);
    localStorage.setItem('theme', theme);

    if (theme === 'dark') {
      themeIcon.className = 'bi bi-sun-fill text-warning';
      themeToggleBtn.classList.replace('btn-outline-dark', 'btn-outline-secondary');
    } else {
      themeIcon.className = 'bi bi-moon-stars-fill text-dark';
      themeToggleBtn.classList.replace('btn-outline-secondary', 'btn-outline-dark');
    }
  }

  // Detecta ou restaura o tema preferido
  const savedTheme = localStorage.getItem('theme') || 
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(savedTheme);

  themeToggleBtn.addEventListener('click', () => {
    const currentTheme = document.documentElement.getAttribute('data-bs-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    applyTheme(newTheme);
  });

  // BUSCA E FILTROS
  function buildWildcardRegex(query) {
    const escaped = query.replace(/[-\/\\^$+?.()|[\]{}]/g, '\\$&');
    const regexStr = '^' + escaped.replace(/\*/g, '.');
    return new RegExp(regexStr, 'i');
  }

  function filterData() {
    const query = searchInput.value.trim().toLowerCase();
    const selectedClasse = classeFilter.value;
    const selectedStatus = statusFilter.value;
    const selectedNatureza = naturezaFilter.value;

    clearBtn.style.display = query ? 'block' : 'none';

    filteredData = DATA.filter(item => {
      if (selectedClasse && item.classe !== selectedClasse) return false;
      if (selectedStatus && item.status !== selectedStatus) return false;
      if (selectedNatureza && item.natureza !== selectedNatureza) return false;

      if (query) {
        if (query.includes('*')) {
          const regex = buildWildcardRegex(query);
          return regex.test(item.conta);
        } else {
          return item.conta.toLowerCase().includes(query) ||
                 item.nome.toLowerCase().includes(query) ||
                 (item.descricao && item.descricao.toLowerCase().includes(query));
        }
      }

      return true;
    });

    page = 1;
    renderResults();
  }

  function renderResults() {
    resultsDiv.innerHTML = '';
    const toRender = filteredData.slice(0, page * PAGE_SIZE);

    if (filteredData.length === 0) {
      resultsDiv.innerHTML = `
        <div class="text-center py-5 text-secondary">
          <i class="bi bi-search display-4 mb-2 d-block"></i>
          <p class="mb-0">Nenhuma conta encontrada para o filtro informado.</p>
        </div>`;
      loadMoreBtn.style.display = 'none';
    } else {
      toRender.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card conta-card shadow-sm';
        
        const badgeNaturezaBg = item.natureza === 'Devedora' ? 'text-bg-primary' : 'text-bg-danger';

        card.innerHTML = `
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
              <span class="fw-bold codigo-mono text-info h6 mb-0">${item.conta}</span>
              <div class="d-flex gap-1">
                <span class="badge text-bg-success-subtle text-success border border-success-subtle">${item.status}</span>
                <span class="badge ${badgeNaturezaBg}">${item.natureza}</span>
              </div>
            </div>
            <h2 class="h6 card-title mb-1 text-body-emphasis">${item.nome}</h2>
            ${item.descricao ? `
              <div class="collapse mt-2 text-secondary small" id="desc-${index}">
                <div class="pt-2 border-top">${item.descricao}</div>
              </div>
            ` : ''}
          </div>
        `;

        if (item.descricao) {
          card.addEventListener('click', () => {
            const collapseEl = document.getElementById(`desc-${index}`);
            const bsCollapse = bootstrap.Collapse.getOrCreateInstance(collapseEl);
            bsCollapse.toggle();
          });
        }

        resultsDiv.appendChild(card);
      });

      loadMoreBtn.style.display = (toRender.length < filteredData.length) ? 'inline-block' : 'none';
    }

    resultCount.textContent = `Exibindo ${Math.min(toRender.length, filteredData.length)} de ${filteredData.length} resultados`;
    totalCount.textContent = `Total: ${DATA.length} contas`;
  }

  // Event Listeners
  searchInput.addEventListener('input', filterData);
  classeFilter.addEventListener('change', filterData);
  statusFilter.addEventListener('change', filterData);
  naturezaFilter.addEventListener('change', filterData);

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    filterData();
  });

  loadMoreBtn.addEventListener('click', () => {
    page++;
    renderResults();
  });

  // Inicialização
  filterData();
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
