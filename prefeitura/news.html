<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notícias Campo Largo - Carrossel com Imagens</title>
  <style>
    :root {
      --primary: #004d99;
      --secondary: #0073e6;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1f2937;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    .status-badge {
      text-align: center;
      padding: 8px 16px;
      font-size: 0.85rem;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 1rem;
      background: #e5e7eb;
      color: #374151;
    }

    .carousel {
      position: relative;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.4s ease-in-out;
      width: 100%;
    }

    .slide {
      min-width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 450px;
    }

    /* Container da Imagem da Notícia */
    .news-image-container {
      width: 100%;
      height: 220px;
      background-color: #e5e7eb;
      overflow: hidden;
      position: relative;
    }

    .news-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .news-content {
      padding: 1.5rem 2rem 1rem 2rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .badge {
      align-self: flex-start;
      background-color: var(--secondary);
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 12px;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }

    .title {
      font-size: 1.25rem;
      color: var(--primary);
      margin-bottom: 0.8rem;
      line-height: 1.4;
    }

    .desc {
      font-size: 0.95rem;
      color: #4b5563;
      line-height: 1.5;
      flex-grow: 1;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem 1.5rem 2rem;
      border-top: 1px solid #e5e7eb;
    }

    .date { font-size: 0.85rem; color: #6b7280; }

    .link {
      color: var(--secondary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .link:hover { text-decoration: underline; }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: #f9fafb;
      border-top: 1px solid #f3f4f6;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .input-box {
      margin-top: 1.5rem;
      background: white;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-top: 0.5rem;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="status" class="status-badge">Aguardando dados da .area-resultados-consulta...</div>

    <div class="carousel">
      <div class="carousel-track" id="track"></div>
      
      <div class="controls">
        <button class="btn" id="prevBtn">❮ Anterior</button>
        <span id="counter" style="font-weight: bold;">0 / 0</span>
        <button class="btn" id="nextBtn">Próxima ❯</button>
      </div>
    </div>

    <!-- Campo para Inserção do HTML da Tela -->
    <div class="input-box">
      <p><strong>Cole abaixo o HTML completo capturado da <code>.area-resultados-consulta</code>:</strong></p>
      <textarea id="rawHtml" placeholder="Cole o código extraído aqui..."></textarea>
      <button class="btn" style="margin-top: 8px;" onclick="parseManualInput()">Gerar Carrossel com Fotos</button>
    </div>
  </div>

  <script>
    let newsList = [];
    let currentIndex = 0;
    const DOMAIN = 'https://www.campolargo.pr.gov.br';

    function renderCarousel() {
      const track = document.getElementById('track');
      track.innerHTML = '';

      newsList.forEach(item => {
        const slide = document.createElement('div');
        slide.className = 'slide';

        // Bloco de imagem (exibe placeholder caso não haja foto na matéria)
        const imageHtml = item.image 
          ? `<div class="news-image-container"><img src="${item.image}" alt="${item.title}" class="news-image" onerror="this.parentNode.style.display='none'"></div>`
          : '';

        slide.innerHTML = `
          ${imageHtml}
          <div class="news-content">
            <span class="badge">${item.category}</span>
            <h2 class="title">${item.title}</h2>
            <p class="desc">${item.description}</p>
          </div>
          <div class="footer">
            <span class="date">${item.date}</span>
            <a href="${item.link}" target="_blank" class="link">Ver matéria ➔</a>
          </div>
        `;
        track.appendChild(slide);
      });
    }

    function updateCarousel() {
      const track = document.getElementById('track');
      const counter = document.getElementById('counter');
      if (newsList.length === 0) return;

      track.style.transform = `translateX(-${currentIndex * 100}%)`;
      counter.textContent = `${currentIndex + 1} / ${newsList.length}`;
    }

    function parseHTML(htmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');
      
      const container = doc.querySelector('.area-resultados-consulta') || doc.body;
      const items = [];

      // Procura os blocos da consulta
      const elements = container.querySelectorAll('a, .item, article, li, div[class*="noticia"]');

      elements.forEach(el => {
        const titleEl = el.querySelector('h2, h3, h4, strong, .titulo') || el;
        const descEl = el.querySelector('p, .descricao, .resumo');
        const dateEl = el.querySelector('.data, time, span');
        const categoryEl = el.querySelector('.categoria, .badge');
        
        // Extração Inteligente de Imagem
        const imgEl = el.querySelector('img');
        let imgUrl = '';

        if (imgEl) {
          // Checa src, data-src ou srcset
          imgUrl = imgEl.getAttribute('src') || imgEl.getAttribute('data-src') || '';
        } else {
          // Checa background-image via atributo style
          const bgEl = el.querySelector('[style*="background"]');
          if (bgEl) {
            const style = bgEl.getAttribute('style');
            const match = style.match(/url\(['"]?(.*?)['"]?\)/);
            if (match) imgUrl = match[1];
          }
        }

        // Formatação do Link da Imagem para URL Absoluta
        if (imgUrl && !imgUrl.startsWith('http') && !imgUrl.startsWith('data:')) {
          imgUrl = DOMAIN + (imgUrl.startsWith('/') ? '' : '/') + imgUrl;
        }

        const title = titleEl ? titleEl.textContent.trim() : '';
        const description = descEl ? descEl.textContent.trim() : 'Clique abaixo para ler os detalhes da matéria no portal oficial.';
        const date = dateEl ? dateEl.textContent.trim() : '';
        const category = categoryEl ? categoryEl.textContent.trim() : 'CAMPO LARGO';
        
        let link = el.tagName === 'A' ? el.getAttribute('href') : el.querySelector('a')?.getAttribute('href');
        if (link && !link.startsWith('http')) {
          link = DOMAIN + (link.startsWith('/') ? '' : '/') + link;
        }

        if (title.length > 8 && !items.some(i => i.title === title)) {
          items.push({ 
            title, 
            description, 
            date, 
            category, 
            image: imgUrl,
            link: link || '#' 
          });
        }
      });

      if (items.length > 0) {
        newsList = items.slice(0, 10);
        document.getElementById('status').textContent = `${newsList.length} notícias com imagens processadas!`;
        document.getElementById('status').style.background = '#d1fae5';
        document.getElementById('status').style.color = '#065f46';
        currentIndex = 0;
        renderCarousel();
        updateCarousel();
      } else {
        document.getElementById('status').textContent = 'Nenhuma notícia com imagem foi estruturada.';
        document.getElementById('status').style.background = '#fee2e2';
        document.getElementById('status').style.color = '#991b1b';
      }
    }

    function parseManualInput() {
      const raw = document.getElementById('rawHtml').value;
      if (raw) parseHTML(raw);
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      currentIndex = (currentIndex > 0) ? currentIndex - 1 : newsList.length - 1;
      updateCarousel();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      currentIndex = (currentIndex < newsList.length - 1) ?
