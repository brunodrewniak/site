<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rota Campo Largo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>

/* Layout: seletor de rotas no topo; mapa esquemático com zoom/arraste à esquerda, lista de paradas com detalhe à direita; empilha no celular. */
:root {
  --bg: #edf1f2;
  --panel: #fbfcfc;
  --map: #e3ebed;
  --grid: #d3dee1;
  --ink: #12262b;
  --muted: #57696e;
  --line: #cbd8db;
  --accent: #0b6b6e;
  --on-accent: #ffffff;
  --start: #b4530a;
  --on-start: #ffffff;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a1d; --panel: #142226; --map: #101d21; --grid: #1c2e34;
    --ink: #e3eef0; --muted: #8ea4a9; --line: #263a40;
    --accent: #3cc4bd; --on-accent: #06181a; --start: #f2a43c; --on-start: #1a1004;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a1d; --panel: #142226; --map: #101d21; --grid: #1c2e34;
  --ink: #e3eef0; --muted: #8ea4a9; --line: #263a40;
  --accent: #3cc4bd; --on-accent: #06181a; --start: #f2a43c; --on-start: #1a1004;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.5;
  padding-block: 20px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 4vw, 34px); line-height: 1.1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 66ch; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.routes { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: 500 13px var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 7px 14px; cursor: pointer; line-height: 1.2; display: inline-flex; gap: 8px; align-items: baseline;
}
.chip small { font: 400 11px var(--mono); color: var(--muted); }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chip[aria-pressed="true"] small { color: inherit; opacity: 0.85; }
.chip:focus-visible, .btn:focus-visible, .stop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
@media (max-width: 920px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.mapcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); align-items: center; }
.bar .spacer { flex: 1; }
.btn {
  font: 500 13px var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 12px; cursor: pointer; line-height: 1.2;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.stage { position: relative; height: clamp(380px, 64vh, 700px); background: var(--map); }
#map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.dragging #map { cursor: grabbing; }
.zoom { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoom .btn { width: 36px; height: 36px; padding: 0; font-size: 18px; }
.scale { position: absolute; left: 12px; bottom: 12px; font: 500 11px var(--mono); color: var(--muted); }
.scale i { display: block; height: 6px; border: 1.5px solid var(--ink); border-top: 0; margin-bottom: 3px; }
.badge { position: absolute; right: 12px; bottom: 12px; font: 400 11px var(--mono); color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; }

.grid-l { stroke: var(--grid); stroke-width: 1; fill: none; }
.leg { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; fill: none; }
.leg.todo { stroke-dasharray: 2 7; stroke-opacity: 0.6; }
.chev { fill: var(--accent); }
.mk { cursor: pointer; outline: none; }
.mk .c { fill: var(--accent); stroke: var(--map); stroke-width: 2.5; }
.mk.start .c { fill: var(--start); }
.mk .n { font: 600 12px var(--mono); fill: var(--on-accent); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.mk.start .n { fill: var(--on-start); }
.mk .ring { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0; }
.mk.start .ring { stroke: var(--start); }
.mk.sel .ring, .mk:focus-visible .ring { opacity: 1; }
.mk .lbl { font: 500 13px var(--body); fill: var(--ink); paint-order: stroke; stroke: var(--map); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.mk.sel .lbl { font-weight: 600; }

.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.summary { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.summary h2 { font: 700 20px/1.15 var(--display); margin: 0; text-wrap: balance; }
.summary p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat b { display: block; font: 500 20px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat span { font-size: 12px; color: var(--muted); line-height: 1.3; display: block; }
.link { color: var(--accent); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.stops { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stops li + li { border-top: 1px solid var(--line); }
.stop { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; color: inherit; font: inherit; padding: 11px 14px; cursor: pointer; }
.stop:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font: 600 12px var(--mono); display: grid; place-items: center; }
.start .num { background: var(--start); color: var(--on-start); }
.sel > .stop { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.kind { display: block; font: 400 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.d { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.detail { padding: 2px 14px 14px 52px; display: flex; flex-direction: column; gap: 8px; }
.detail dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; }
.detail dt { color: var(--muted); font-size: 12px; }
.detail dd { margin: 0; overflow-wrap: anywhere; }
.detail .mono { font: 400 12.5px var(--mono); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.acts a.btn { text-decoration: none; display: inline-block; }
.note { color: var(--muted); font-size: 12px; max-width: 90ch; margin: 0; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

body { margin: 0; padding-inline: 16px; }
.stage { height: clamp(420px, 70vh, 760px); background: var(--map); }
#map { width: 100%; height: 100%; cursor: grab; font-family: var(--body); z-index: 0; }
.leaflet-container { background: var(--map); }
.pin { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font: 600 12px var(--mono); display: grid; place-items: center; border: 2.5px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.45); }
.pin.start { background: var(--start); color: var(--on-start); }
.pin.sel { transform: scale(1.3); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent), 0 1px 6px rgba(0,0,0,.5); }
.pin.start.sel { box-shadow: 0 0 0 3px color-mix(in srgb, var(--start) 45%, transparent), 0 1px 6px rgba(0,0,0,.5); }
.leaflet-tooltip { font: 600 12px var(--body); color: #12262b; border: 0; box-shadow: 0 1px 5px rgba(0,0,0,.35); }
.status { font: 400 11px var(--mono); color: var(--muted); }
</style>
</head>
<body>
<div class="wrap" style="padding-block: 20px 36px">
  <header>
    <div class="eyebrow">Campo Largo · PR</div>
    <h1>Rotas a partir da Prefeitura</h1>
    <p class="sub">Escolha uma rota para ver as paradas sobre o mapa. Clique numa parada para abrir endereço, distância e link do Google Maps.</p>
  </header>

  <div class="routes" id="routes" role="group" aria-label="Rotas"></div>

  <div class="layout">
    <section class="mapcard" aria-label="Mapa da rota">
      <div class="bar">
        <button class="btn" id="prev" type="button">‹ Anterior</button>
        <button class="btn" id="next" type="button">Próxima ›</button>
        <button class="btn primary" id="play" type="button">Percorrer rota</button>
        <span class="spacer"></span>
        <button class="btn" id="base" type="button" aria-pressed="false">Satélite</button>
        <button class="btn" id="zfit" type="button">Ver rota toda</button>
      </div>
      <div class="stage"><div id="map"></div></div>
    </section>

    <aside class="side">
      <div class="summary">
        <div>
          <h2 id="rt-name"></h2>
          <p id="rt-desc"></p>
        </div>
        <div class="stats">
          <div class="stat"><b id="st-n"></b><span>paradas</span></div>
          <div class="stat"><b id="st-t"></b><span id="st-tl">distância total</span></div>
          <div class="stat"><b id="st-m"></b><span>maior trecho</span></div>
        </div>
        <div class="status" id="status"></div>
        <a class="link" id="gmaps" href="#" target="_blank" rel="noopener">Abrir esta rota no Google Maps</a>
      </div>
      <ol class="stops" id="stops"></ol>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function () {
  var PREF = { short: 'Prefeitura', name: 'Prefeitura Municipal de Campo Largo', kind: 'Ponto de partida', addr: 'Av. Padre Natal Pigato, 925 – Vila Elizabeth', cep: '83601-630', lat: -25.4558, lon: -49.5176976 };
  var US = 'Unidade de saúde';

  var ROUTES = [
    { id: 'upa', name: 'UPA', desc: 'Trecho direto entre a Prefeitura e a UPA.', stops: [
      PREF,
      { short: 'UPA Campo Largo', name: 'UPA – Unidade de Pronto Atendimento de Campo Largo', kind: 'Pronto atendimento', addr: 'R. Francisco Xavier de Almeida Garret, 385 – Abranche Guimarães', cep: '83601-230', lat: -25.4695108, lon: -49.5230378 }
    ] },
    { id: 'centro', name: 'Centro', desc: 'Unidades de saúde da área central, de Bom Jesus a Botiatuva.', stops: [
      PREF,
      { short: 'UBS Dante Portugal Castagnolli', name: 'UBS Dante Portugal Castagnolli', kind: US, addr: 'R. Joanim Stroparo, 119 – Vila Bancária', cep: '83601-460', lat: -25.4693083, lon: -49.524695 },
      { short: 'UBS Bom Jesus', name: 'UBS Bom Jesus', kind: US, addr: 'Rua Ademar de Barros, 126 – Jardim Social', cep: '', lat: -25.4552449, lon: -49.5414705 },
      { short: 'US Vila Glória', name: 'Unidade de Saúde Vila Glória', kind: US, addr: 'R. Belo Horizonte, 165 – Campo Largo/PR', cep: '', lat: -25.473676, lon: -49.5700388 },
      { short: 'US Águas Claras', name: 'Unidade de Saúde Águas Claras', kind: US, addr: 'R. José de Paiva Vidal, 2800 – São Marcos', cep: '83602-160', lat: -25.4744128, lon: -49.5500468 },
      { short: 'UBS Ari Fior', name: 'UBS Ari Fior (Riacho Doce)', kind: US, addr: 'R. Salmão, 513 – Jardim Três Rios', cep: '83603-265', lat: -25.4956187, lon: -49.5456462 },
      { short: 'US Amadeu Mazzo', name: 'Unidade de Saúde Amadeu Mazzo (Botiatuva)', kind: US, addr: 'R. João Stukas, 3237 – Jardim Tropical', cep: '83602-110', lat: -25.4773694, lon: -49.5365089 }
    ] },
    { id: 'leste', name: 'Leste e Distrito de Ferraria', desc: 'Rondinha, Cercadinho e o distrito de Ferraria.', stops: [
      PREF,
      { short: 'PS Jardim Rondinha', name: 'Posto de Saúde Jardim Rondinha', kind: US, addr: 'Rondinha – Campo Largo/PR', cep: '', lat: -25.4480348, lon: -49.4800238 },
      { short: 'UBS Cercadinho', name: 'Unidade Básica de Saúde Cercadinho', kind: US, addr: 'R. Nossa Sra. da Aparecida – Cercadinho', cep: '83602-140', lat: -25.4423407, lon: -49.4549416 },
      { short: 'R. Mato Grosso, 1558', name: 'R. Mato Grosso, 1558', kind: 'Ferraria', addr: 'R. Mato Grosso, 1558 – Ferraria', cep: '83608-640', lat: -25.448786, lon: -49.4552432 },
      { short: 'US Jardim Guarany', name: 'Unidade de Saúde Jardim Guarany', kind: US, addr: 'R. Ipê – Jardim Guarany', cep: '83608-390', lat: -25.4308063, lon: -49.4053287 },
      { short: 'UBS Ferraria', name: 'Unidade Básica de Saúde Ferraria', kind: US, addr: 'R. Izídio Santo Cruzara, 1750 – Jardim Boa Vista', cep: '83609-235', lat: -25.4588726, lon: -49.3966462 }
    ] },
    { id: 'norte', name: 'Norte Urbano e Oeste', desc: 'Fazendinha, Rivabem, Itaboa e Itambezinho.', stops: [
      PREF,
      { short: 'UBS Fazendinha', name: 'UBS Fazendinha', kind: US, addr: 'Rod. Eng. Raul Azevedo Macedo, 4603 – Centro', cep: '83606-482', lat: -25.4170851, lon: -49.5037877 },
      { short: 'USF Jardim Rivabem', name: 'USF Jardim Rivabem', kind: US, addr: 'R. Medianeira, s/n – Vila Andreassa Miranda', cep: '83605-550', lat: -25.4491017, lon: -49.5553523 },
      { short: 'US Itaboa', name: 'Unidade de Saúde Itaboa', kind: US, addr: 'R. Epaminondas Bülow, 113 – Lot. Itaboa', cep: '83605-190', lat: -25.4541949, lon: -49.5655377 },
      { short: 'UBS Itambezinho', name: 'Unidade Básica de Saúde Itambezinho', kind: US, addr: 'Rua Cassimiro Karman, s/nº – Itambezinho', cep: '83602-665', lat: -25.3244461, lon: -49.6856269 }
    ] },
    { id: 'rural', name: 'Distrito Rural e Bateias', desc: 'Bateias, Três Córregos e São Silvestre, ao norte do município.', stops: [
      PREF,
      { short: 'UBS Bateias', name: 'Unidade Básica de Saúde Bateias', kind: US, addr: 'Rua Joil Antonio Basso – Bateias', cep: '', lat: -25.3610408, lon: -49.5105371 },
      { short: 'UBS Santa Cruz', name: 'Unidade Básica de Saúde Santa Cruz', kind: US, addr: 'Três Córregos – Campo Largo/PR', cep: '', lat: -25.2194316, lon: -49.6941699 },
      { short: 'UBS Três Córregos', name: 'UBS Três Córregos', kind: US, addr: 'Estrada Principal de Três Córregos, s/n – Campo Largo/PR', cep: '', lat: -25.277255087379345, lon: -49.720683380173085 },
      { short: 'UBS São Silvestre', name: 'Unidade Básica de Saúde São Silvestre', kind: US, addr: 'Palmital de São Silvestre – Campo Largo/PR', cep: '', lat: -25.1056323, lon: -49.6499303 },
      { short: 'UBS São Pedro', name: 'Unidade Básica de Saúde São Pedro', kind: US, addr: 'São Silvestre – Campo Largo/PR', cep: '', lat: -25.0144561, lon: -49.6028313 }
    ] }
  ];

  function fmt(m) {
    if (m < 1000) return Math.round(m / 10) * 10 + ' m';
    return (m / 1000).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' km';
  }
  var rad = Math.PI / 180;
  function hav(a, b) {
    var dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
    var h = Math.pow(Math.sin(dLat / 2), 2) + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.pow(Math.sin(dLon / 2), 2);
    return 2 * 6371000 * Math.asin(Math.sqrt(h));
  }

  var map = L.map('map', { zoomControl: true, attributionControl: true });
  var street = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' });
  var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagens &copy; Esri, Maxar, Earthstar Geographics' });
  var satOn = false;
  street.addTo(map);
  document.getElementById('base').addEventListener('click', function () {
    satOn = !satOn;
    if (satOn) { map.removeLayer(street); sat.addTo(map); } else { map.removeLayer(sat); street.addTo(map); }
    this.setAttribute('aria-pressed', satOn ? 'true' : 'false');
    this.textContent = satOn ? 'Mapa de ruas' : 'Satélite';
  });

  var stops = [], cur = 0, sel = -1, markers = [], line = null, items = [], playTimer = null, token = 0, byRoad = false;

  function icon(i, on) {
    return L.divIcon({ className: '', html: '<div class="pin' + (i === 0 ? ' start' : '') + (on ? ' sel' : '') + '">' + (i + 1) + '</div>', iconSize: [28, 28], iconAnchor: [14, 14] });
  }

  function numbers() {
    var total = 0, longest = 0;
    stops.forEach(function (s, i) {
      if (i) { if (!byRoad) s.leg = hav(stops[i - 1], s); total += s.leg; if (s.leg > longest) longest = s.leg; }
      s.cum = total;
    });
    document.getElementById('st-n').textContent = stops.length;
    document.getElementById('st-t').textContent = fmt(total);
    document.getElementById('st-m').textContent = fmt(longest);
    document.getElementById('st-tl').textContent = byRoad ? 'pelas ruas, de carro' : 'em linha reta, no total';
  }

  function buildList() {
    var list = document.getElementById('stops');
    list.textContent = ''; items = [];
    stops.forEach(function (s, i) {
      var li = document.createElement('li');
      if (i === 0) li.className = 'start';
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'stop'; btn.setAttribute('aria-expanded', 'false');
      btn.innerHTML = '<span class="num"></span><span class="nm"><span class="kind"></span></span><span class="d"></span>';
      btn.querySelector('.num').textContent = i + 1;
      btn.querySelector('.kind').textContent = s.kind;
      btn.querySelector('.nm').appendChild(document.createTextNode(s.name));
      btn.querySelector('.d').textContent = i ? '+ ' + fmt(s.leg) : 'início';
      var det = document.createElement('div');
      det.className = 'detail'; det.hidden = true;
      det.innerHTML = '<dl><dt>Endereço</dt><dd></dd>' + (s.cep ? '<dt>CEP</dt><dd class="mono"></dd>' : '') +
        '<dt>Coordenadas</dt><dd class="mono"></dd>' + (i ? '<dt>Trecho anterior</dt><dd></dd>' : '') + '<dt>Acumulado</dt><dd></dd></dl>' +
        '<div class="acts"><a class="btn" target="_blank" rel="noopener">Ver no Google Maps</a><button type="button" class="btn">Copiar coordenadas</button></div>';
      var dds = det.querySelectorAll('dd'), k = 0, how = byRoad ? 'pelas ruas' : 'em linha reta';
      dds[k++].textContent = s.addr;
      if (s.cep) dds[k++].textContent = s.cep;
      var coord = s.lat.toFixed(6) + ', ' + s.lon.toFixed(6);
      var coordEl = dds[k++]; coordEl.textContent = coord;
      if (i) dds[k++].textContent = fmt(s.leg) + ' ' + how + ' desde a parada ' + i;
      dds[k++].textContent = fmt(s.cum) + (i ? ' desde a Prefeitura' : '');
      det.querySelector('a').href = 'https://www.google.com/maps/search/?api=1&query=' + s.lat + ',' + s.lon;
      var cb = det.querySelector('button');
      cb.addEventListener('click', function () {
        var done = function () { cb.textContent = 'Copiado'; setTimeout(function () { cb.textContent = 'Copiar coordenadas'; }, 1600); };
        var fallback = function () {
          var rg = document.createRange(); rg.selectNodeContents(coordEl);
          var sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(rg);
          cb.textContent = 'Selecionado, copie com Ctrl+C';
        };
        try { navigator.clipboard.writeText(coord).then(done, fallback); } catch (e) { fallback(); }
      });
      li.appendChild(btn); li.appendChild(det); list.appendChild(li);
      btn.addEventListener('click', function () { stopPlay(); select(i === sel ? -1 : i, true); });
      items.push({ li: li, btn: btn, det: det });
    });
  }

  function select(i, fly) {
    sel = i;
    items.forEach(function (it, k) {
      var on = k === sel;
      it.li.classList.toggle('sel', on);
      it.det.hidden = !on;
      it.btn.setAttribute('aria-expanded', on ? 'true' : 'false');
    });
    markers.forEach(function (m, k) { m.setIcon(icon(k, k === sel)); m.setZIndexOffset(k === sel ? 1000 : 0); if (k !== sel) m.closeTooltip(); });
    if (sel >= 0) {
      markers[sel].openTooltip();
      if (fly) map.flyTo([stops[sel].lat, stops[sel].lon], Math.max(map.getZoom(), 15), { duration: 0.8 });
    }
  }

  function drawLine(latlngs, dashed) {
    if (line) map.removeLayer(line);
    line = L.polyline(latlngs, { color: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#0b6b6e', weight: 5, opacity: 0.9, dashArray: dashed ? '2 9' : null, lineCap: 'round' }).addTo(map);
    markers.forEach(function (m) { m.setZIndexOffset(m === markers[sel] ? 1000 : 0); });
  }

  function fitAll() { map.fitBounds(L.latLngBounds(stops.map(function (s) { return [s.lat, s.lon]; })), { padding: [48, 48] }); }

  function loadRoute(idx) {
    stopPlay(); token++;
    var my = token;
    cur = idx; sel = -1; byRoad = false;
    var r = ROUTES[idx];
    stops = r.stops.map(function (s) { return Object.assign({}, s); });
    Array.prototype.forEach.call(document.querySelectorAll('#routes .chip'), function (c, i) { c.setAttribute('aria-pressed', i === idx ? 'true' : 'false'); });
    document.getElementById('rt-name').textContent = r.name;
    document.getElementById('rt-desc').textContent = r.desc;
    var o = stops[0], d = stops[stops.length - 1];
    var wp = stops.slice(1, -1).map(function (s) { return s.lat + ',' + s.lon; }).join('|');
    document.getElementById('gmaps').href = 'https://www.google.com/maps/dir/?api=1&origin=' + o.lat + ',' + o.lon + '&destination=' + d.lat + ',' + d.lon + (wp ? '&waypoints=' + encodeURIComponent(wp) : '') + '&travelmode=driving';

    markers.forEach(function (m) { map.removeLayer(m); });
    markers = stops.map(function (s, i) {
      var m = L.marker([s.lat, s.lon], { icon: icon(i, false), title: s.name, keyboard: true }).addTo(map);
      m.bindTooltip(s.short, { direction: 'right', offset: [16, 0] });
      m.on('click', function () { stopPlay(); select(sel === i ? -1 : i, false); });
      return m;
    });
    numbers(); buildList();
    drawLine(stops.map(function (s) { return [s.lat, s.lon]; }), true);
    fitAll();
    document.getElementById('status').textContent = 'Buscando o traçado pelas ruas…';

    /* traçado por ruas (servidor público do OSRM); se falhar, mantém as linhas retas */
    var coords = stops.map(function (s) { return s.lon + ',' + s.lat; }).join(';');
    fetch('https://router.project-osrm.org/route/v1/driving/' + coords + '?overview=full&geometries=geojson&steps=false')
      .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then(function (j) {
        if (my !== token || !j.routes || !j.routes[0]) return;
        var rt = j.routes[0];
        stops.forEach(function (s, i) { if (i) s.leg = rt.legs[i - 1].distance; });
        byRoad = true;
        drawLine(rt.geometry.coordinates.map(function (c) { return [c[1], c[0]]; }), false);
        numbers();
        var keep = sel; buildList(); select(keep, false);
        document.getElementById('status').textContent = 'Traçado pelas ruas, calculado com OSRM.';
      })
      .catch(function () {
        if (my !== token) return;
        document.getElementById('status').textContent = 'Não foi possível buscar o traçado pelas ruas. Mostrando linhas retas.';
      });
  }

  function stopPlay() { if (playTimer) { clearInterval(playTimer); playTimer = null; } document.getElementById('play').textContent = 'Percorrer rota'; }
  document.getElementById('play').addEventListener('click', function () {
    if (playTimer) { stopPlay(); return; }
    var n = 0;
    this.textContent = 'Pausar';
    select(0, true);
    playTimer = setInterval(function () {
      n++;
      if (n >= stops.length) { stopPlay(); fitAll(); return; }
      select(n, true);
    }, 2600);
  });
  document.getElementById('next').addEventListener('click', function () { stopPlay(); select(sel < 0 ? 0 : Math.min(stops.length - 1, sel + 1), true); });
  document.getElementById('prev').addEventListener('click', function () { stopPlay(); select(sel <= 0 ? 0 : sel - 1, true); });
  document.getElementById('zfit').addEventListener('click', function () { stopPlay(); fitAll(); });

  var chipBox = document.getElementById('routes');
  ROUTES.forEach(function (r, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<span></span><small></small>';
    b.querySelector('span').textContent = r.name;
    b.querySelector('small').textContent = r.stops.length + ' pts';
    b.addEventListener('click', function () { loadRoute(i); });
    chipBox.appendChild(b);
  });
  var start = 0;
  try { var h = location.hash.replace('#', ''); ROUTES.forEach(function (r, i) { if (r.id === h) start = i; }); } catch (e) {}
  loadRoute(start);
})();
</script>
</body>
</html>
